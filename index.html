<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>micro:bit BLE Text Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101216;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 22px;
    text-align: center;
    background: #181b21;
    border-bottom: 1px solid #2c3038;
}

header h1 {
    margin: 0;
}

header p {
    color: #9298a3;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 18px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    color: white;
    cursor: pointer;
}

button:disabled {
    opacity: 0.4;
}

#connect {
    background: #20bd68;
}

#disconnect {
    background: #e04444;
}

#send {
    background: #5865f2;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.status {
    margin-top: 15px;
    background: #181b21;
    border: 1px solid #2c3038;
    border-radius: 14px;
    padding: 15px;
}

#status {
    font-weight: bold;
}

.device {
    color: #9298a3;
    margin-top: 6px;
}

.chat {
    margin-top: 20px;
    background: #181b21;
    border: 1px solid #2c3038;
    border-radius: 14px;
    padding: 15px;
}

.messages {
    height: 350px;
    overflow-y: auto;
    padding: 5px;
}

.message {
    margin: 8px 0;
    padding: 10px 13px;
    border-radius: 12px;
    max-width: 85%;
    word-break: break-word;
}

.phone {
    margin-left: auto;
    background: #5865f2;
}

.microbit {
    margin-right: auto;
    background: #292e38;
}

.system {
    margin: 8px auto;
    background: #20242b;
    color: #9298a3;
    text-align: center;
    font-size: 12px;
}

.time {
    display: block;
    margin-top: 4px;
    font-size: 10px;
    opacity: 0.6;
}

.input-area {
    display: flex;
    gap: 10px;
    margin-top: 12px;
}

#textInput {
    flex: 1;
    min-width: 0;
    background: #0c0e11;
    border: 1px solid #363b45;
    border-radius: 11px;
    color: white;
    padding: 14px;
    outline: none;
    font-size: 16px;
}

#send {
    min-width: 75px;
}

.log-section {
    margin-top: 20px;
}

.log {
    background: #08090b;
    border: 1px solid #2c3038;
    border-radius: 14px;
    padding: 12px;
    height: 180px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
}

.info {
    color: #66aaff;
}

.success {
    color: #35d07f;
}

.error {
    color: #ff5555;
}

.warning {
    color: #ffd24a;
}

@media (max-width: 500px) {
    .input-area {
        flex-direction: column;
    }

    #send {
        width: 100%;
    }
}
</style>
</head>

<body>

<header>
    <h1>📡 micro:bit BLE Chat</h1>
    <p>문자 보내기 / 받기</p>
</header>

<div class="container">

    <div class="controls">

        <button id="connect">
            🔵 연결
        </button>

        <button id="disconnect" disabled>
            🔴 연결 해제
        </button>

    </div>

    <div class="status">

        <div id="status">
            연결되지 않음
        </div>

        <div
            id="deviceName"
            class="device"
        >
            기기 없음
        </div>

    </div>


    <div class="chat">

        <h2>💬 메시지</h2>

        <div
            id="messages"
            class="messages"
        ></div>


        <div class="input-area">

            <input
                id="textInput"
                type="text"
                placeholder="micro:bit로 보낼 글자를 입력..."
                autocomplete="off"
            >

            <button
                id="send"
                disabled
            >
                전송
            </button>

        </div>

    </div>


    <div class="log-section">

        <h2>📜 BLE 로그</h2>

        <div
            id="log"
            class="log"
        ></div>

    </div>

</div>


<script>

/*
========================================
UUID
========================================
*/

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";


/*
micro:bit → S25
실제 장치에서 INDICATE
*/

const MICROBIT_TO_PHONE_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";


/*
S25 → micro:bit
WRITE / WRITE WITHOUT RESPONSE
*/

const PHONE_TO_MICROBIT_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/*
========================================
상태
========================================
*/

let device = null;
let server = null;
let service = null;

let microbitToPhone = null;
let phoneToMicrobit = null;

let connected = false;

let receiveBuffer = "";


/*
========================================
HTML
========================================
*/

const connectButton =
    document.getElementById(
        "connect"
    );

const disconnectButton =
    document.getElementById(
        "disconnect"
    );

const sendButton =
    document.getElementById(
        "send"
    );

const textInput =
    document.getElementById(
        "textInput"
    );

const statusElement =
    document.getElementById(
        "status"
    );

const deviceNameElement =
    document.getElementById(
        "deviceName"
    );

const messagesElement =
    document.getElementById(
        "messages"
    );

const logElement =
    document.getElementById(
        "log"
    );


/*
========================================
로그
========================================
*/

function log(
    text,
    type = "info"
) {

    const line =
        document.createElement(
            "div"
        );

    line.className =
        type;

    const time =
        new Date()
        .toLocaleTimeString();

    line.textContent =
        "[" +
        time +
        "] " +
        text;

    logElement.appendChild(
        line
    );

    logElement.scrollTop =
        logElement.scrollHeight;

}


/*
========================================
채팅 메시지
========================================
*/

function addMessage(
    text,
    type
) {

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " +
        type;


    message.textContent =
        text;


    const time =
        document.createElement(
            "span"
        );

    time.className =
        "time";

    time.textContent =
        new Date()
        .toLocaleTimeString();


    message.appendChild(
        time
    );


    messagesElement.appendChild(
        message
    );


    messagesElement.scrollTop =
        messagesElement.scrollHeight;

}


/*
========================================
상태
========================================
*/

function setStatus(
    text,
    type = ""
) {

    statusElement.textContent =
        text;

    statusElement.className =
        type;

}


/*
========================================
연결
========================================
*/

connectButton.addEventListener(
    "click",
    connect
);


async function connect() {

    try {

        if (
            !navigator.bluetooth
        ) {

            alert(
                "이 브라우저는 Web Bluetooth를 지원하지 않습니다."
            );

            return;
        }


        log(
            "Bluetooth 기기 검색...",
            "info"
        );


        setStatus(
            "🔍 기기 검색 중...",
            "warning"
        );


        /*
        모든 BLE 장치 검색
        */

        device =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        deviceNameElement.textContent =
            device.name ||
            "micro:bit";


        log(
            "선택됨: " +
            (
                device.name ||
                "이름 없음"
            ),
            "success"
        );


        /*
        연결 끊김 이벤트
        */

        device.addEventListener(
            "gattserverdisconnected",
            disconnected
        );


        /*
        GATT
        */

        setStatus(
            "🔌 GATT 연결 중...",
            "warning"
        );


        server =
            await device.gatt.connect();


        log(
            "✅ GATT 연결 성공",
            "success"
        );


        /*
        Service
        */

        service =
            await server.getPrimaryService(
                SERVICE_UUID
            );


        log(
            "✅ UART Service 발견",
            "success"
        );


        /*
        micro:bit → S25
        */

        microbitToPhone =
            await service.getCharacteristic(
                MICROBIT_TO_PHONE_UUID
            );


        log(
            "✅ 6e400002 발견",
            "success"
        );


        /*
        S25 → micro:bit
        */

        phoneToMicrobit =
            await service.getCharacteristic(
                PHONE_TO_MICROBIT_UUID
            );


        log(
            "✅ 6e400003 발견",
            "success"
        );


        /*
        INDICATE
        */

        try {

            await microbitToPhone
                .startNotifications();

            log(
                "✅ INDICATE 활성화",
                "success"
            );

        } catch (error) {

            log(
                "❌ INDICATE 활성화 실패: " +
                error.name +
                ": " +
                error.message,
                "error"
            );

        }


        /*
        수신 이벤트
        */

        microbitToPhone
            .addEventListener(
                "characteristicvaluechanged",
                receiveMessage
            );


        connected = true;


        connectButton.disabled =
            true;

        disconnectButton.disabled =
            false;

        sendButton.disabled =
            false;


        setStatus(
            "🟢 연결됨",
            "success"
        );


        addMessage(
            "micro:bit에 연결되었습니다.",
            "system"
        );


        log(
            "🎉 BLE 문자 통신 준비 완료!",
            "success"
        );


        textInput.focus();


    } catch (error) {

        console.error(error);

        log(
            "❌ " +
            error.name +
            ": " +
            error.message,
            "error"
        );


        setStatus(
            "❌ 연결 실패",
            "error"
        );

    }

}


/*
========================================
문자 수신
========================================
*/

function receiveMessage(
    event
) {

    const value =
        event.target.value;


    const decoder =
        new TextDecoder(
            "utf-8"
        );


    const text =
        decoder.decode(
            value
        );


    log(
        "← " +
        text.replace(
            /\r?\n/g,
            "\\n"
        ),
        "info"
    );


    receiveBuffer +=
        text;


    const lines =
        receiveBuffer.split(
            "\n"
        );


    receiveBuffer =
        lines.pop();


    for (
        const line of lines
    ) {

        const message =
            line.trim();


        if (
            message.length === 0
        ) {

            continue;

        }


        addMessage(
            "🔵 micro:bit: " +
            message,
            "microbit"
        );

    }

}


/*
========================================
문자 전송
========================================
*/

sendButton.addEventListener(
    "click",
    sendMessage
);


textInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();

        }

    }
);


async function sendMessage() {

    if (
        !connected ||
        !phoneToMicrobit
    ) {

        log(
            "❌ micro:bit가 연결되지 않았습니다.",
            "error"
        );

        return;
    }


    const message =
        textInput.value;


    if (
        message.length === 0
    ) {

        return;

    }


    try {

        const encoder =
            new TextEncoder();


        const data =
            encoder.encode(
                message + "\n"
            );


        /*
        WRITE WITHOUT RESPONSE
        */

        if (
            phoneToMicrobit
                .writeValueWithoutResponse
        ) {

            await phoneToMicrobit
                .writeValueWithoutResponse(
                    data
                );

        } else {

            await phoneToMicrobit
                .writeValue(
                    data
                );

        }


        addMessage(
            "🟢 나: " +
            message,
            "phone"
        );


        log(
            "→ " +
            message,
            "success"
        );


        textInput.value =
            "";


        textInput.focus();


    } catch (error) {

        log(
            "❌ 문자 전송 실패: " +
            error.name +
            ": " +
            error.message,
            "error"
        );

    }

}


/*
========================================
연결 해제
========================================
*/

disconnectButton.addEventListener(
    "click",
    disconnect
);


function disconnect() {

    if (
        device &&
        device.gatt &&
        device.gatt.connected
    ) {

        device.gatt.disconnect();

    }

}


/*
========================================
연결 끊김
========================================
*/

function disconnected() {

    connected = false;


    connectButton.disabled =
        false;

    disconnectButton.disabled =
        true;

    sendButton.disabled =
        true;


    setStatus(
        "🔴 연결 끊김",
        "error"
    );


    addMessage(
        "micro:bit 연결이 끊어졌습니다.",
        "system"
    );


    log(
        "Bluetooth 연결 해제",
        "warning"
    );

}


/*
========================================
시작
========================================
*/

log(
    "micro:bit BLE Chat 준비 완료",
    "success"
);

log(
    "Service: 6e400001...",
    "info"
);

log(
    "수신: 6e400002... INDICATE",
    "info"
);

log(
    "송신: 6e400003... WRITE",
    "info"
);

</script>

</body>
</html>
