<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>micro:bit BLE Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101114;
    color: white;
    font-family: Arial, sans-serif;
}

header {
    padding: 20px;
    text-align: center;
    background: #181a20;
    border-bottom: 1px solid #2d3038;
}

header h1 {
    margin: 0 0 8px;
    font-size: 25px;
}

header p {
    margin: 0;
    color: #999;
}

.container {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 20px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 13px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

#connectBtn {
    background: #2ecc71;
    color: white;
}

#disconnectBtn {
    background: #e74c3c;
    color: white;
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.status {
    background: #181a20;
    border: 1px solid #2d3038;
    border-radius: 14px;
    padding: 15px;
    margin-bottom: 20px;
}

.status-title {
    font-weight: bold;
    margin-bottom: 8px;
}

#status {
    color: #ffcc00;
}

.device-name {
    color: #aaa;
    margin-top: 5px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 12px;
}

.card {
    background: #181a20;
    border: 1px solid #2d3038;
    border-radius: 14px;
    padding: 18px;
}

.card-title {
    color: #999;
    font-size: 14px;
    margin-bottom: 10px;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

.unit {
    color: #888;
    font-size: 14px;
    margin-left: 3px;
}

.section {
    margin-top: 20px;
}

.section h2 {
    font-size: 18px;
}

.buttons {
    display: flex;
    gap: 10px;
}

.ab {
    flex: 1;
    text-align: center;
    padding: 20px;
    border-radius: 14px;
    background: #181a20;
    border: 1px solid #2d3038;
}

.ab-value {
    font-size: 30px;
    font-weight: bold;
}

.graph-box {
    background: #181a20;
    border: 1px solid #2d3038;
    border-radius: 14px;
    padding: 10px;
}

canvas {
    width: 100%;
    height: 250px;
    display: block;
}

.command {
    display: flex;
    gap: 10px;
}

.command input {
    flex: 1;
    min-width: 0;
    background: #0d0e11;
    color: white;
    border: 1px solid #333740;
    border-radius: 10px;
    padding: 12px;
    outline: none;
}

.command button {
    background: #5865f2;
    color: white;
}

.log {
    background: #0b0c0f;
    border: 1px solid #2d3038;
    border-radius: 14px;
    padding: 12px;
    height: 220px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
}

.log-line {
    margin-bottom: 5px;
}

.ok {
    color: #2ecc71;
}

.error {
    color: #ff5555;
}

.info {
    color: #66aaff;
}

.warning {
    color: #ffcc00;
}

footer {
    text-align: center;
    padding: 30px;
    color: #666;
    font-size: 12px;
}
</style>
</head>

<body>

<header>
    <h1>📡 micro:bit BLE Dashboard</h1>
    <p>Nordic UART Service</p>
</header>

<div class="container">

    <div class="controls">
        <button id="connectBtn">🔵 micro:bit 연결</button>
        <button id="disconnectBtn" disabled>🔴 연결 해제</button>
    </div>

    <div class="status">
        <div class="status-title">상태</div>
        <div id="status">연결되지 않음</div>
        <div class="device-name" id="deviceName">기기 없음</div>
    </div>

    <div class="grid">

        <div class="card">
            <div class="card-title">🌡️ 온도</div>
            <div class="value">
                <span id="temperature">--</span>
                <span class="unit">°C</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">💡 밝기</div>
            <div class="value">
                <span id="light">--</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">🎤 소리</div>
            <div class="value">
                <span id="sound">--</span>
            </div>
        </div>

        <div class="card">
            <div class="card-title">📦 패킷</div>
            <div class="value">
                <span id="packets">0</span>
            </div>
        </div>

    </div>

    <div class="section">
        <h2>📐 가속도</h2>

        <div class="grid">

            <div class="card">
                <div class="card-title">X</div>
                <div class="value">
                    <span id="x">--</span>
                    <span class="unit">mg</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Y</div>
                <div class="value">
                    <span id="y">--</span>
                    <span class="unit">mg</span>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Z</div>
                <div class="value">
                    <span id="z">--</span>
                    <span class="unit">mg</span>
                </div>
            </div>

        </div>
    </div>

    <div class="section">
        <h2>🎮 버튼</h2>

        <div class="buttons">

            <div class="ab">
                <div>A</div>
                <div class="ab-value" id="buttonA">OFF</div>
            </div>

            <div class="ab">
                <div>B</div>
                <div class="ab-value" id="buttonB">OFF</div>
            </div>

        </div>
    </div>

    <div class="section">
        <h2>📈 센서 그래프</h2>

        <div class="graph-box">
            <canvas id="graph"></canvas>
        </div>
    </div>

    <div class="section">
        <h2>📤 micro:bit로 보내기</h2>

        <div class="command">
            <input
                id="commandInput"
                type="text"
                placeholder="예: LED_ON"
            >

            <button id="sendBtn" disabled>
                보내기
            </button>
        </div>
    </div>

    <div class="section">
        <h2>📜 통신 로그</h2>

        <div class="log" id="log"></div>
    </div>

</div>

<footer>
    micro:bit V2 • Bluetooth Low Energy • Nordic UART Service
</footer>


<script>

/*
==================================================
BLE UUID
==================================================
*/

const UART_SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const UART_RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const UART_TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/*
==================================================
BLE 상태
==================================================
*/

let device = null;
let server = null;
let service = null;

let rxCharacteristic = null;
let txCharacteristic = null;

let connected = false;

let packetCount = 0;

let buffer = "";


/*
==================================================
DOM
==================================================
*/

const connectBtn =
    document.getElementById("connectBtn");

const disconnectBtn =
    document.getElementById("disconnectBtn");

const sendBtn =
    document.getElementById("sendBtn");

const commandInput =
    document.getElementById("commandInput");

const statusElement =
    document.getElementById("status");

const deviceNameElement =
    document.getElementById("deviceName");

const logElement =
    document.getElementById("log");

const temperatureElement =
    document.getElementById("temperature");

const lightElement =
    document.getElementById("light");

const soundElement =
    document.getElementById("sound");

const xElement =
    document.getElementById("x");

const yElement =
    document.getElementById("y");

const zElement =
    document.getElementById("z");

const buttonAElement =
    document.getElementById("buttonA");

const buttonBElement =
    document.getElementById("buttonB");

const packetsElement =
    document.getElementById("packets");


/*
==================================================
로그
==================================================
*/

function log(message, type = "info") {

    const line =
        document.createElement("div");

    line.className =
        "log-line " + type;

    const time =
        new Date().toLocaleTimeString();

    line.textContent =
        "[" + time + "] " + message;

    logElement.appendChild(line);

    logElement.scrollTop =
        logElement.scrollHeight;

    console.log(message);
}


/*
==================================================
상태 표시
==================================================
*/

function setStatus(message, type = "info") {

    statusElement.textContent =
        message;

    statusElement.className =
        type;
}


/*
==================================================
연결
==================================================
*/

connectBtn.addEventListener("click", async () => {

    try {

        if (!navigator.bluetooth) {

            alert(
                "이 브라우저는 Web Bluetooth를 지원하지 않습니다."
            );

            return;
        }

        log(
            "micro:bit 검색 시작...",
            "info"
        );

        setStatus(
            "micro:bit 검색 중...",
            "warning"
        );

        /*
        ==========================================
        micro:bit 선택창
        ==========================================
        */

        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        services: [
                            UART_SERVICE_UUID
                        ]
                    }
                ],

                optionalServices: [
                    UART_SERVICE_UUID
                ]

            });


        log(
            "선택된 기기: " +
            (device.name || "이름 없음"),
            "ok"
        );


        deviceNameElement.textContent =
            device.name ||
            "micro:bit";


        /*
        ==========================================
        disconnect 이벤트
        ==========================================
        */

        device.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        /*
        ==========================================
        GATT 연결
        ==========================================
        */

        setStatus(
            "GATT 연결 중...",
            "warning"
        );

        log(
            "GATT 서버 연결 중...",
            "info"
        );

        server =
            await device.gatt.connect();


        log(
            "GATT 연결 성공!",
            "ok"
        );


        /*
        ==========================================
        UART Service
        ==========================================
        */

        log(
            "UART Service 가져오는 중...",
            "info"
        );

        service =
            await server.getPrimaryService(
                UART_SERVICE_UUID
            );


        log(
            "UART Service 발견!",
            "ok"
        );


        /*
        ==========================================
        RX
        ==========================================
        */

        log(
            "RX Characteristic 가져오는 중...",
            "info"
        );

        rxCharacteristic =
            await service.getCharacteristic(
                UART_RX_UUID
            );


        log(
            "RX Characteristic 발견!",
            "ok"
        );


        /*
        ==========================================
        TX
        ==========================================
        */

        log(
            "TX Characteristic 가져오는 중...",
            "info"
        );

        txCharacteristic =
            await service.getCharacteristic(
                UART_TX_UUID
            );


        log(
            "TX Characteristic 발견!",
            "ok"
        );


        /*
        ==========================================
        Notify 시작
        ==========================================
        */

        log(
            "TX Notify 시작...",
            "info"
        );

        await txCharacteristic.startNotifications();


        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleNotification
        );


        log(
            "TX Notify 활성화!",
            "ok"
        );


        /*
        ==========================================
        UI 변경
        ==========================================
        */

        connected = true;

        connectBtn.disabled = true;
        disconnectBtn.disabled = false;
        sendBtn.disabled = false;

        setStatus(
            "🟢 연결됨",
            "ok"
        );

        log(
            "micro:bit 연결 완료!",
            "ok"
        );

    } catch (error) {

        console.error(error);

        log(
            "❌ " +
            error.name +
            ": " +
            error.message,
            "error"
        );

        setStatus(
            "연결 실패",
            "error"
        );

    }

});


/*
==================================================
연결 해제
==================================================
*/

disconnectBtn.addEventListener(
    "click",
    disconnect
);


function disconnect() {

    try {

        if (
            device &&
            device.gatt &&
            device.gatt.connected
        ) {

            device.gatt.disconnect();

        }

    } catch (error) {

        console.error(error);

    }

}


/*
==================================================
연결 끊김
==================================================
*/

function handleDisconnected() {

    connected = false;

    connectBtn.disabled = false;
    disconnectBtn.disabled = true;
    sendBtn.disabled = true;

    setStatus(
        "연결되지 않음",
        "error"
    );

    log(
        "micro:bit 연결이 끊어졌습니다.",
        "warning"
    );

}


/*
==================================================
BLE Notification
==================================================
*/

function handleNotification(event) {

    const value =
        event.target.value;

    const decoder =
        new TextDecoder("utf-8");

    const text =
        decoder.decode(value);

    log(
        "← " +
        text.replace(/\r?\n/g, "\\n"),
        "info"
    );

    buffer += text;


    /*
    ==========================================
    줄 단위로 분리
    ==========================================
    */

    const lines =
        buffer.split("\n");

    buffer =
        lines.pop();


    for (const line of lines) {

        const clean =
            line.trim();

        if (clean.length === 0) {
            continue;
        }

        processData(clean);

    }

}


/*
==================================================
데이터 처리
==================================================
*/

function processData(data) {

    /*
    예상 형식:

    DATA,
    temperature,
    light,
    sound,
    x,
    y,
    z,
    a,
    b
    */

    if (!data.startsWith("DATA,")) {

        log(
            "수신 데이터: " +
            data,
            "warning"
        );

        return;
    }


    const parts =
        data.split(",");


    if (parts.length < 9) {

        log(
            "DATA 형식 오류: " +
            data,
            "error"
        );

        return;
    }


    const temperature =
        Number(parts[1]);

    const light =
        Number(parts[2]);

    const sound =
        Number(parts[3]);

    const x =
        Number(parts[4]);

    const y =
        Number(parts[5]);

    const z =
        Number(parts[6]);

    const a =
        Number(parts[7]);

    const b =
        Number(parts[8]);


    /*
    ==========================================
    화면 업데이트
    ==========================================
    */

    temperatureElement.textContent =
        temperature;

    lightElement.textContent =
        light;

    soundElement.textContent =
        sound;

    xElement.textContent =
        x;

    yElement.textContent =
        y;

    zElement.textContent =
        z;


    buttonAElement.textContent =
        a ? "ON" : "OFF";

    buttonBElement.textContent =
        b ? "ON" : "OFF";


    /*
    ==========================================
    패킷 수
    ==========================================
    */

    packetCount++;

    packetsElement.textContent =
        packetCount;


    /*
    ==========================================
    그래프
    ==========================================
    */

    addGraphData(
        temperature,
        sound,
        light
    );

}


/*
==================================================
micro:bit로 데이터 보내기
==================================================
*/

sendBtn.addEventListener(
    "click",
    sendCommand
);


commandInput.addEventListener(
    "keydown",
    event => {

        if (event.key === "Enter") {

            sendCommand();

        }

    }
);


async function sendCommand() {

    if (
        !connected ||
        !rxCharacteristic
    ) {

        log(
            "micro:bit가 연결되지 않았습니다.",
            "error"
        );

        return;
    }


    const text =
        commandInput.value.trim();


    if (!text) {
        return;
    }


    try {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(
                text + "\n"
            );


        /*
        ======================================
        Write Without Response 우선
        ======================================
        */

        if (
            rxCharacteristic.writeValueWithoutResponse
        ) {

            await rxCharacteristic
                .writeValueWithoutResponse(data);

        } else {

            await rxCharacteristic
                .writeValue(data);

        }


        log(
            "→ " + text,
            "ok"
        );


        commandInput.value = "";


    } catch (error) {

        log(
            "전송 실패: " +
            error.message,
            "error"
        );

    }

}


/*
==================================================
그래프
==================================================
*/

const canvas =
    document.getElementById("graph");

const ctx =
    canvas.getContext("2d");


let graphTemperature = [];
let graphSound = [];
let graphLight = [];


const MAX_POINTS = 80;


function addGraphData(
    temperature,
    sound,
    light
) {

    graphTemperature.push(
        temperature
    );

    graphSound.push(
        sound
    );

    graphLight.push(
        light
    );


    if (
        graphTemperature.length >
        MAX_POINTS
    ) {

        graphTemperature.shift();
        graphSound.shift();
        graphLight.shift();

    }


    drawGraph();

}


function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    canvas.width =
        rect.width *
        window.devicePixelRatio;

    canvas.height =
        rect.height *
        window.devicePixelRatio;

    ctx.scale(
        window.devicePixelRatio,
        window.devicePixelRatio
    );

    drawGraph();

}


function drawGraph() {

    const width =
        canvas.clientWidth;

    const height =
        canvas.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
    ==========================================
    Grid
    ==========================================
    */

    ctx.strokeStyle =
        "#292c34";

    ctx.lineWidth = 1;


    for (
        let i = 0;
        i <= 5;
        i++
    ) {

        const y =
            (height / 5) * i;


        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();

    }


    /*
    ==========================================
    그래프
    ==========================================
    */

    drawLine(
        graphTemperature,
        height,
        50
    );

    drawLine(
        graphSound,
        height,
        255
    );

    drawLine(
        graphLight,
        height,
        255
    );

}


function drawLine(
    data,
    height,
    maxValue
) {

    if (data.length < 2) {
        return;
    }


    ctx.beginPath();

    ctx.lineWidth = 2;

    ctx.strokeStyle =
        "#ffffff";


    for (
        let i = 0;
        i < data.length;
        i++
    ) {

        const x =
            (i /
            (MAX_POINTS - 1)) *
            canvas.clientWidth;


        let value =
            Number(data[i]);


        if (value < 0) {
            value = 0;
        }

        if (value > maxValue) {
            value = maxValue;
        }


        const y =
            height -
            (value / maxValue) *
            height;


        if (i === 0) {

            ctx.moveTo(
                x,
                y
            );

        } else {

            ctx.lineTo(
                x,
                y
            );

        }

    }


    ctx.stroke();

}


window.addEventListener(
    "resize",
    resizeCanvas
);


resizeCanvas();


/*
==================================================
페이지 시작
==================================================
*/

log(
    "Dashboard 준비 완료",
    "ok"
);

log(
    "UART Service: " +
    UART_SERVICE_UUID,
    "info"
);

log(
    "RX: " +
    UART_RX_UUID,
    "info"
);

log(
    "TX: " +
    UART_TX_UUID,
    "info"
);

</script>

</body>
</html>
