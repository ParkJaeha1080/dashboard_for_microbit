<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#111827">

<title>micro:bit Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0f19;
    color: #f9fafb;
    font-family: Arial, sans-serif;
}

header {
    padding: 16px;
    background: #111827;
    border-bottom: 1px solid #293244;
    position: sticky;
    top: 0;
    z-index: 10;
}

header h1 {
    margin: 0 0 10px;
    font-size: 21px;
}

.status {
    font-size: 13px;
    color: #9ca3af;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 14px;
}

button {
    border: 0;
    border-radius: 12px;
    padding: 12px 15px;
    font-size: 14px;
    cursor: pointer;
    color: white;
    background: #2563eb;
}

button:active {
    transform: scale(0.97);
}

button.secondary {
    background: #374151;
}

button.danger {
    background: #dc2626;
}

button.green {
    background: #16a34a;
}

.controls {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
    margin-bottom: 14px;
}

.card {
    background: #111827;
    border: 1px solid #293244;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 14px;
}

.card-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 12px;
}

.device {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
}

.device-name {
    font-weight: bold;
}

.device-id {
    font-size: 11px;
    color: #6b7280;
    word-break: break-all;
    margin-top: 4px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.sensor {
    background: #1f2937;
    padding: 12px;
    border-radius: 12px;
}

.sensor-name {
    color: #9ca3af;
    font-size: 12px;
}

.sensor-value {
    font-size: 22px;
    font-weight: bold;
    margin-top: 5px;
}

.chat {
    height: 380px;
    overflow-y: auto;
    background: #080c14;
    border-radius: 14px;
    padding: 12px;
}

.message {
    margin: 8px 0;
    display: flex;
}

.message.user {
    justify-content: flex-end;
}

.bubble {
    max-width: 85%;
    padding: 10px 13px;
    border-radius: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
}

.user .bubble {
    background: #2563eb;
}

.bot .bubble {
    background: #1f2937;
}

.input-area {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.input-area input {
    flex: 1;
    min-width: 0;
    background: #1f2937;
    color: white;
    border: 1px solid #374151;
    border-radius: 12px;
    padding: 12px;
    outline: none;
}

.command-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.log {
    height: 180px;
    overflow-y: auto;
    background: #05070b;
    border-radius: 10px;
    padding: 10px;
    font-family: monospace;
    font-size: 11px;
    white-space: pre-wrap;
}

.ok {
    color: #4ade80;
}

.error {
    color: #f87171;
}

.info {
    color: #60a5fa;
}

.warning {
    color: #facc15;
}

@media(max-width:600px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .command-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
</head>

<body>

<header>
    <h1>🤖 micro:bit Chat</h1>
    <div class="status" id="status">
        연결 안 됨
    </div>
</header>

<div class="container">

    <div class="controls">
        <button onclick="connectBluetooth()">
            🔵 micro:bit 연결
        </button>

        <button class="danger" onclick="disconnectBluetooth()">
            ❌ 연결 해제
        </button>
    </div>

    <div class="card">
        <div class="card-title">📡 연결된 장치</div>

        <div class="device">
            <div>
                <div class="device-name" id="deviceName">
                    없음
                </div>

                <div class="device-id" id="deviceId">
                    -
                </div>
            </div>

            <div id="connectionIcon">
                🔴
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">📊 센서</div>

        <div class="grid">

            <div class="sensor">
                <div class="sensor-name">온도</div>
                <div class="sensor-value">
                    <span id="temperature">--</span> °C
                </div>
            </div>

            <div class="sensor">
                <div class="sensor-name">빛</div>
                <div class="sensor-value">
                    <span id="light">--</span>
                </div>
            </div>

            <div class="sensor">
                <div class="sensor-name">소리</div>
                <div class="sensor-value">
                    <span id="sound">--</span>
                </div>
            </div>

            <div class="sensor">
                <div class="sensor-name">X</div>
                <div class="sensor-value">
                    <span id="accelX">--</span>
                </div>
            </div>

            <div class="sensor">
                <div class="sensor-name">Y</div>
                <div class="sensor-value">
                    <span id="accelY">--</span>
                </div>
            </div>

            <div class="sensor">
                <div class="sensor-name">Z</div>
                <div class="sensor-value">
                    <span id="accelZ">--</span>
                </div>
            </div>

        </div>
    </div>

    <div class="card">

        <div class="card-title">
            💬 Chat
        </div>

        <div class="chat" id="chat">

            <div class="message bot">
                <div class="bubble">
                    안녕! 🤖<br>
                    micro:bit에게 명령을 보내보세요.
                </div>
            </div>

        </div>

        <div class="input-area">

            <input
                id="chatInput"
                placeholder="예: 하트 보여줘"
                onkeydown="if(event.key==='Enter') sendChat()"
            >

            <button onclick="sendChat()">
                전송
            </button>

        </div>

    </div>

    <div class="card">

        <div class="card-title">
            ⚡ 빠른 명령
        </div>

        <div class="command-grid">

            <button onclick="sendCommand('HELLO')">
                👋 HELLO
            </button>

            <button onclick="sendCommand('HEART')">
                ❤️ 하트
            </button>

            <button onclick="sendCommand('WHAT')">
                ❓ WHAT
            </button>

            <button onclick="sendCommand('DANCE')">
                💃 DANCE
            </button>

            <button onclick="sendCommand('BEEP')">
                🔊 BEEP
            </button>

            <button onclick="sendCommand('LED_ON')">
                💡 LED ON
            </button>

            <button onclick="sendCommand('LED_OFF')">
                🌑 LED OFF
            </button>

            <button onclick="sendCommand('TEMP')">
                🌡️ TEMP
            </button>

            <button onclick="sendCommand('LIGHT')">
                ☀️ LIGHT
            </button>

            <button onclick="sendCommand('SOUND')">
                🔊 SOUND
            </button>

            <button onclick="sendCommand('SENSOR')">
                📊 SENSOR
            </button>

            <button onclick="sendCommand('PING')">
                📡 PING
            </button>

        </div>

    </div>

    <div class="card">

        <div class="card-title">
            📝 BLE 로그
        </div>

        <div class="log" id="log"></div>

    </div>

</div>

<script>

/* =========================================================
   BLE UUID
========================================================= */

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/* =========================================================
   BLE 변수
========================================================= */

let bluetoothDevice = null;
let gattServer = null;

let rxCharacteristic = null;
let txCharacteristic = null;

let receivedBuffer = "";


/* =========================================================
   로그
========================================================= */

function log(message, type = "") {

    const box = document.getElementById("log");

    const time = new Date().toLocaleTimeString();

    const line = document.createElement("div");

    line.className = type;

    line.textContent =
        "[" + time + "] " + message;

    box.appendChild(line);

    box.scrollTop = box.scrollHeight;

    console.log(message);
}


/* =========================================================
   상태
========================================================= */

function setStatus(text) {

    document.getElementById("status").textContent = text;
}


/* =========================================================
   Bluetooth 지원 확인
========================================================= */

async function checkBluetooth() {

    if (!navigator.bluetooth) {

        setStatus("❌ Web Bluetooth 지원 안 됨");

        log(
            "❌ navigator.bluetooth이 없습니다.",
            "error"
        );

        alert(
            "이 브라우저에서는 Web Bluetooth를 사용할 수 없습니다.\n\nChrome에서 HTTPS 페이지로 열어주세요."
        );

        return false;
    }

    try {

        const available =
            await navigator.bluetooth.getAvailability();

        log(
            "Bluetooth 사용 가능: " + available,
            available ? "ok" : "warning"
        );

        if (!available) {

            setStatus("⚠️ Bluetooth 사용 불가");

            return false;
        }

    } catch(error) {

        log(
            "Bluetooth 상태 확인 실패: " +
            error.message,
            "warning"
        );
    }

    return true;
}


/* =========================================================
   micro:bit 연결
========================================================= */

async function connectBluetooth() {

    try {

        log(
            "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        );

        log(
            "🔎 micro:bit 검색 시작...",
            "info"
        );

        setStatus("🔎 Bluetooth 기기 선택 중...");


        /* ---------------------------------------------
           Web Bluetooth 지원 확인
        --------------------------------------------- */

        const supported =
            await checkBluetooth();

        if (!supported) {
            return;
        }


        /* ---------------------------------------------
           중요!
           
           기존:
           filters: [{ services: [SERVICE_UUID] }]

           이번 버전:
           acceptAllDevices: true

           → 광고 서비스가 검색창에서 누락되어도
             일단 모든 BLE 장치를 선택할 수 있게 함.
        --------------------------------------------- */

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        /* ---------------------------------------------
           선택된 장치
        --------------------------------------------- */

        log(
            "✅ 선택된 장치: " +
            (bluetoothDevice.name || "이름 없음"),
            "ok"
        );

        document.getElementById("deviceName")
            .textContent =
            bluetoothDevice.name ||
            "이름 없음";

        document.getElementById("deviceId")
            .textContent =
            bluetoothDevice.id || "-";


        /* ---------------------------------------------
           연결 끊김 이벤트
        --------------------------------------------- */

        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        /* ---------------------------------------------
           GATT 연결
        --------------------------------------------- */

        setStatus("🔗 GATT 연결 중...");

        log(
            "🔗 GATT 서버 연결 중...",
            "info"
        );

        gattServer =
            await bluetoothDevice.gatt.connect();


        log(
            "✅ GATT 연결 성공!",
            "ok"
        );


        /* ---------------------------------------------
           서비스
        --------------------------------------------- */

        log(
            "🔎 UART 서비스 찾는 중...",
            "info"
        );

        const service =
            await gattServer.getPrimaryService(
                SERVICE_UUID
            );


        log(
            "✅ UART 서비스 발견",
            "ok"
        );


        /* ---------------------------------------------
           RX
           
           002 = INDICATE
           
           micro:bit → S25
        --------------------------------------------- */

        rxCharacteristic =
            await service.getCharacteristic(
                RX_UUID
            );


        log(
            "✅ RX characteristic 발견",
            "ok"
        );


        /* ---------------------------------------------
           TX
           
           003 = WRITE / WRITE_NO_RESPONSE
           
           S25 → micro:bit
        --------------------------------------------- */

        txCharacteristic =
            await service.getCharacteristic(
                TX_UUID
            );


        log(
            "✅ TX characteristic 발견",
            "ok"
        );


        /* ---------------------------------------------
           Notify / Indicate 시작
        --------------------------------------------- */

        await rxCharacteristic.startNotifications();


        rxCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleBluetoothData
        );


        log(
            "📡 RX 알림/indicate 활성화",
            "ok"
        );


        /* ---------------------------------------------
           UI
        --------------------------------------------- */

        setStatus(
            "🟢 연결됨: " +
            (bluetoothDevice.name || "micro:bit")
        );

        document.getElementById("connectionIcon")
            .textContent = "🟢";


        addBotMessage(
            "micro:bit 연결 완료! 🟢"
        );


        /* ---------------------------------------------
           연결 확인
        --------------------------------------------- */

        await sendCommand("PING");


    } catch(error) {

        console.error(error);

        log(
            "❌ " +
            error.name +
            ": " +
            error.message,
            "error"
        );

        setStatus(
            "❌ 연결 실패"
        );

        document.getElementById("connectionIcon")
            .textContent = "🔴";


        if (error.name === "NotFoundError") {

            addBotMessage(
                "Bluetooth 기기 선택이 취소되었거나 검색된 기기가 없습니다."
            );

        } else if (error.name === "SecurityError") {

            addBotMessage(
                "보안 문제입니다. HTTPS 페이지에서 실행해야 합니다."
            );

        } else {

            addBotMessage(
                "연결 실패: " +
                error.message
            );
        }
    }
}


/* =========================================================
   연결 해제
========================================================= */

function disconnectBluetooth() {

    try {

        if (
            bluetoothDevice &&
            bluetoothDevice.gatt &&
            bluetoothDevice.gatt.connected
        ) {

            bluetoothDevice.gatt.disconnect();

        }

    } catch(error) {

        log(
            "연결 해제 오류: " +
            error.message,
            "error"
        );
    }

    bluetoothDevice = null;
    gattServer = null;
    rxCharacteristic = null;
    txCharacteristic = null;

    setStatus("🔴 연결 안 됨");

    document.getElementById("connectionIcon")
        .textContent = "🔴";

    document.getElementById("deviceName")
        .textContent = "없음";

    document.getElementById("deviceId")
        .textContent = "-";

    log(
        "🔌 연결 해제"
    );
}


/* =========================================================
   연결 끊김
========================================================= */

function handleDisconnected() {

    log(
        "❌ micro:bit 연결이 끊겼습니다.",
        "error"
    );

    setStatus(
        "🔴 연결 끊김"
    );

    document.getElementById("connectionIcon")
        .textContent = "🔴";

    addBotMessage(
        "micro:bit 연결이 끊어졌어요. 🔴"
    );
}


/* =========================================================
   데이터 수신
========================================================= */

function handleBluetoothData(event) {

    const value =
        new TextDecoder("utf-8")
            .decode(event.target.value);

    log(
        "⬅️ RX: " + value,
        "info"
    );

    receivedBuffer += value;

    let lines =
        receivedBuffer.split("\n");

    receivedBuffer =
        lines.pop() || "";

    for (const line of lines) {

        const data =
            line.trim();

        if (data.length === 0) {
            continue;
        }

        processReceivedData(data);
    }
}


/* =========================================================
   수신 데이터 처리
========================================================= */

function processReceivedData(data) {

    log(
        "📥 DATA: " + data
    );


    /* ---------------------------------------------
       센서 데이터

       DATA,temp,light,sound,x,y,z,a,b
    --------------------------------------------- */

    if (data.startsWith("DATA,")) {

        const parts =
            data.split(",");

        if (parts.length >= 8) {

            document.getElementById("temperature")
                .textContent =
                parts[1];

            document.getElementById("light")
                .textContent =
                parts[2];

            document.getElementById("sound")
                .textContent =
                parts[3];

            document.getElementById("accelX")
                .textContent =
                parts[4];

            document.getElementById("accelY")
                .textContent =
                parts[5];

            document.getElementById("accelZ")
                .textContent =
                parts[6];

            log(
                "📊 센서 데이터 업데이트",
                "ok"
            );
        }

        return;
    }


    /* ---------------------------------------------
       일반 수신 메시지
    --------------------------------------------- */

    if (data.startsWith("RECEIVED,")) {

        const text =
            data.substring(9);

        addBotMessage(
            "micro:bit: " + text
        );

        return;
    }


    /* ---------------------------------------------
       결과
    --------------------------------------------- */

    if (data.startsWith("RESULT,")) {

        const result =
            data.substring(7);

        addBotMessage(
            "결과: " + result
        );

        return;
    }


    /* ---------------------------------------------
       PONG
    --------------------------------------------- */

    if (
        data === "PONG" ||
        data === "PING_OK"
    ) {

        addBotMessage(
            "micro:bit 응답: 🟢 PONG"
        );

        return;
    }


    /* ---------------------------------------------
       기타
    --------------------------------------------- */

    addBotMessage(
        "micro:bit: " + data
    );
}


/* =========================================================
   명령 전송
========================================================= */

async function sendCommand(command) {

    if (!txCharacteristic) {

        log(
            "❌ micro:bit가 연결되지 않았습니다.",
            "error"
        );

        addBotMessage(
            "먼저 micro:bit를 연결해주세요. 🔵"
        );

        return false;
    }


    try {

        const message =
            command + "\n";

        const data =
            new TextEncoder()
                .encode(message);


        if (
            typeof txCharacteristic
                .writeValueWithoutResponse ===
            "function"
        ) {

            await txCharacteristic
                .writeValueWithoutResponse(data);

        } else {

            await txCharacteristic
                .writeValue(data);
        }


        log(
            "➡️ TX: " + command,
            "ok"
        );

        return true;


    } catch(error) {

        log(
            "❌ TX 오류: " +
            error.message,
            "error"
        );

        return false;
    }
}


/* =========================================================
   Chat
========================================================= */

async function sendChat() {

    const input =
        document.getElementById("chatInput");

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    addUserMessage(text);

    input.value = "";

    await processChat(text);
}


/* =========================================================
   Chat 처리
========================================================= */

async function processChat(text) {

    const normalized =
        text.toLowerCase().trim();


    /* ---------------------------------------------
       하트
    --------------------------------------------- */

    if (
        normalized.includes("하트") ||
        normalized.includes("사랑") ||
        normalized.includes("heart")
    ) {

        addBotMessage(
            "❤️ 하트를 보여줄게!"
        );

        await sendCommand("HEART");

        return;
    }


    /* ---------------------------------------------
       인사
    --------------------------------------------- */

    if (
        normalized.includes("안녕") ||
        normalized.includes("hello") ||
        normalized.includes("hi")
    ) {

        addBotMessage(
            "안녕! 👋"
        );

        await sendCommand("HELLO");

        return;
    }


    /* ---------------------------------------------
       뭐하지
    --------------------------------------------- */

    if (
        normalized.includes("뭐하지") ||
        normalized.includes("뭐 해") ||
        normalized.includes("what")
    ) {

        addBotMessage(
            "음... 🤔 micro:bit로 재미있는 걸 해보자!"
        );

        await sendCommand("WHAT");

        return;
    }


    /* ---------------------------------------------
       춤
    --------------------------------------------- */

    if (
        normalized.includes("춤") ||
        normalized.includes("댄스") ||
        normalized.includes("dance")
    ) {

        addBotMessage(
            "💃 춤춰볼게!"
        );

        await sendCommand("DANCE");

        return;
    }


    /* ---------------------------------------------
       삐
    --------------------------------------------- */

    if (
        normalized.includes("소리") ||
        normalized.includes("삐") ||
        normalized.includes("beep")
    ) {

        addBotMessage(
            "🔊 삐!"
        );

        await sendCommand("BEEP");

        return;
    }


    /* ---------------------------------------------
       LED 켜기
    --------------------------------------------- */

    if (
        normalized.includes("불 켜") ||
        normalized.includes("led 켜") ||
        normalized.includes("led on")
    ) {

        addBotMessage(
            "💡 LED를 켤게!"
        );

        await sendCommand("LED_ON");

        return;
    }


    /* ---------------------------------------------
       LED 끄기
    --------------------------------------------- */

    if (
        normalized.includes("불 꺼") ||
        normalized.includes("led 꺼") ||
        normalized.includes("led off")
    ) {

        addBotMessage(
            "🌑 LED를 끌게!"
        );

        await sendCommand("LED_OFF");

        return;
    }


    /* ---------------------------------------------
       온도
    --------------------------------------------- */

    if (
        normalized.includes("온도") ||
        normalized.includes("temperature")
    ) {

        addBotMessage(
            "🌡️ 온도를 확인할게!"
        );

        await sendCommand("TEMP");

        return;
    }


    /* ---------------------------------------------
       빛
    --------------------------------------------- */

    if (
        normalized.includes("빛") ||
        normalized.includes("밝기") ||
        normalized.includes("light")
    ) {

        addBotMessage(
            "☀️ 빛 센서를 확인할게!"
        );

        await sendCommand("LIGHT");

        return;
    }


    /* ---------------------------------------------
       센서
    --------------------------------------------- */

    if (
        normalized.includes("센서") ||
        normalized.includes("sensor")
    ) {

        addBotMessage(
            "📊 센서 데이터를 가져올게!"
        );

        await sendCommand("SENSOR");

        return;
    }


    /* ---------------------------------------------
       Ping
    --------------------------------------------- */

    if (
        normalized.includes("ping")
    ) {

        addBotMessage(
            "📡 연결을 확인할게!"
        );

        await sendCommand("PING");

        return;
    }


    /* ---------------------------------------------
       알 수 없는 명령
    --------------------------------------------- */

    addBotMessage(
        "🤔 아직 그 명령은 몰라.\n" +
        "예: \"하트 보여줘\", \"불 켜\", \"온도 알려줘\""
    );

}


/* =========================================================
   사용자 메시지
========================================================= */

function addUserMessage(text) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message user";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   봇 메시지
========================================================= */

function addBotMessage(text) {

    const chat =
        document.getElementById("chat");

    const message =
        document.createElement("div");

    message.className =
        "message bot";

    const bubble =
        document.createElement("div");

    bubble.className =
        "bubble";

    bubble.textContent =
        text;

    message.appendChild(bubble);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   페이지 시작
========================================================= */

window.addEventListener(
    "load",
    async () => {

        log(
            "🤖 micro:bit Chat 시작"
        );

        log(
            "BLE Service: " +
            SERVICE_UUID
        );

        log(
            "RX: " +
            RX_UUID
        );

        log(
            "TX: " +
            TX_UUID
        );

        if (!navigator.bluetooth) {

            log(
                "❌ Web Bluetooth를 사용할 수 없습니다.",
                "error"
            );

        } else {

            log(
                "✅ Web Bluetooth API 발견",
                "ok"
            );

            try {

                const available =
                    await navigator.bluetooth
                        .getAvailability();

                log(
                    "Bluetooth availability: " +
                    available,
                    available ? "ok" : "warning"
                );

            } catch(error) {

                log(
                    "Bluetooth availability 확인 실패",
                    "warning"
                );
            }
        }
    }
);

</script>
