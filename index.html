<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<meta name="theme-color" content="#09090b">

<title>micro:bit AI</title>

<style>

* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #09090b;
    color: #f4f4f5;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    overscroll-behavior: none;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    touch-action: manipulation;
}


/* =====================================================
   APP
===================================================== */

.app {
    width: 100%;
    height: 100%;

    display: flex;

    background: #09090b;
}


/* =====================================================
   DESKTOP SIDEBAR
===================================================== */

.sidebar {
    width: 270px;
    flex-shrink: 0;

    background: #111113;

    border-right: 1px solid #27272a;

    display: flex;
    flex-direction: column;

    padding: 12px;
}

.logo {
    padding: 13px 10px;

    font-size: 18px;
    font-weight: 700;
}

.new-chat {
    width: 100%;

    padding: 12px;

    border: 1px solid #3f3f46;
    border-radius: 9px;

    background: transparent;
    color: #fff;

    text-align: left;

    cursor: pointer;
}

.new-chat:hover {
    background: #27272a;
}

.sidebar-section {
    padding: 18px 10px 7px;

    color: #71717a;

    font-size: 12px;
}

.command-list {
    flex: 1;

    overflow-y: auto;
}

.command-item {
    padding: 10px;

    border-radius: 8px;

    color: #d4d4d8;

    font-size: 14px;

    cursor: pointer;
}

.command-item:hover {
    background: #27272a;
}

.sidebar-bottom {
    padding-top: 8px;

    border-top: 1px solid #27272a;
}

.sidebar-button {
    width: 100%;

    padding: 11px;

    border: 0;
    border-radius: 8px;

    background: transparent;
    color: #d4d4d8;

    text-align: left;

    cursor: pointer;
}

.sidebar-button:hover {
    background: #27272a;
}


/* =====================================================
   MAIN
===================================================== */

.main {
    min-width: 0;

    flex: 1;

    display: flex;
    flex-direction: column;

    position: relative;
}


/* =====================================================
   TOP BAR
===================================================== */

.topbar {
    height: 60px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 18px;

    border-bottom: 1px solid #27272a;

    background:
        rgba(9,9,11,.92);

    backdrop-filter: blur(16px);

    z-index: 20;
}

.title {
    font-size: 16px;
    font-weight: 700;
}

.connection {
    display: flex;
    align-items: center;

    gap: 7px;

    max-width: 200px;

    font-size: 12px;

    color: #a1a1aa;

    overflow: hidden;
}

.connection span {
    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.dot {
    width: 8px;
    height: 8px;

    flex-shrink: 0;

    border-radius: 50%;

    background: #71717a;
}

.dot.connected {
    background: #22c55e;

    box-shadow:
        0 0 10px
        rgba(34,197,94,.7);
}


/* =====================================================
   CHAT
===================================================== */

.chat {
    flex: 1;

    overflow-y: auto;

    padding:
        20px 16px
        130px;

    scroll-behavior: smooth;

    overscroll-behavior: contain;
}

.message {
    width: 100%;
    max-width: 850px;

    margin: 0 auto;

    display: flex;

    gap: 12px;

    padding: 16px 2px;
}

.avatar {
    width: 34px;
    height: 34px;

    min-width: 34px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 10px;

    font-size: 16px;
}

.user-avatar {
    background:
        linear-gradient(
            135deg,
            #2563eb,
            #4f46e5
        );
}

.bot-avatar {
    background:
        linear-gradient(
            135deg,
            #10a37f,
            #059669
        );
}

.message-content {
    min-width: 0;

    flex: 1;

    line-height: 1.65;

    white-space: pre-wrap;

    word-break: break-word;

    font-size: 15px;
}

.bot-message {
    background: #151518;

    border-radius: 13px;

    padding-right: 14px;
}


/* =====================================================
   INPUT
===================================================== */

.input-area {
    position: fixed;

    left: 270px;
    right: 0;
    bottom: 0;

    z-index: 30;

    padding:
        12px 18px
        calc(
            15px +
            env(safe-area-inset-bottom)
        );

    background:
        linear-gradient(
            transparent,
            #09090b 28%
        );
}

.input-box {
    width: 100%;
    max-width: 850px;

    margin: auto;

    display: flex;
    align-items: center;

    padding: 7px;

    border:
        1px solid #3f3f46;

    border-radius: 17px;

    background: #18181b;

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.3);
}

.input-box:focus-within {
    border-color: #52525b;
}

.input-box input {
    flex: 1;

    min-width: 0;

    padding: 11px 10px;

    border: 0;
    outline: 0;

    background: transparent;

    color: #fff;

    font-size: 15px;
}

.input-box input::placeholder {
    color: #71717a;
}

.send {
    width: 42px;
    height: 42px;

    flex-shrink: 0;

    border: 0;

    border-radius: 12px;

    background: #10a37f;
    color: #fff;

    font-size: 19px;

    cursor: pointer;
}

.send:active {
    transform: scale(.94);
}


/* =====================================================
   MOBILE NAV
===================================================== */

.mobile-nav {
    display: none;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
    position: fixed;

    inset: 0;

    z-index: 100;

    display: none;

    align-items: center;
    justify-content: center;

    padding: 16px;

    background:
        rgba(0,0,0,.68);

    backdrop-filter: blur(7px);
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 520px;

    max-height:
        calc(100dvh - 32px);

    overflow-y: auto;

    padding: 20px;

    border:
        1px solid #303034;

    border-radius: 20px;

    background: #18181b;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.55);
}

.modal-title {
    margin-bottom: 18px;

    font-size: 20px;
    font-weight: 750;
}


/* =====================================================
   FIELDS
===================================================== */

.field {
    margin-bottom: 15px;
}

.field label {
    display: block;

    margin-bottom: 7px;

    color: #a1a1aa;

    font-size: 13px;
}

.field input,
.field textarea,
.field select {
    width: 100%;

    padding: 13px;

    outline: 0;

    border:
        1px solid #3f3f46;

    border-radius: 11px;

    background: #0f0f11;

    color: #fff;

    font-size: 15px;
}

.field input:focus,
.field textarea:focus,
.field select:focus {
    border-color: #71717a;
}

.field textarea {
    min-height: 100px;

    resize: vertical;
}


/* =====================================================
   BUTTONS
===================================================== */

.btn {
    min-height: 44px;

    padding: 10px 15px;

    border: 0;

    border-radius: 10px;

    color: #fff;

    cursor: pointer;
}

.btn-green {
    background: #10a37f;
}

.btn-gray {
    background: #3f3f46;
}

.btn-red {
    background: #dc2626;
}

.btn-blue {
    background: #2563eb;
}

.btn:active {
    transform: scale(.97);
}

.modal-buttons {
    display: flex;

    gap: 8px;

    justify-content: flex-end;

    margin-top: 18px;
}


/* =====================================================
   DEVICE
===================================================== */

.device-info {
    margin-top: 13px;

    padding: 14px;

    border:
        1px solid #303034;

    border-radius: 12px;

    background: #0f0f11;
}

.device-name {
    font-size: 15px;
    font-weight: 650;
}

.device-id {
    margin-top: 5px;

    color: #71717a;

    font-size: 11px;

    word-break: break-all;
}

.connect-button {
    width: 100%;

    min-height: 47px;

    margin-top: 10px;

    border: 0;

    border-radius: 11px;

    background: #2563eb;

    color: #fff;

    cursor: pointer;
}

.connect-button:active {
    transform: scale(.98);
}


/* =====================================================
   SENSOR
===================================================== */

.sensor-grid {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 9px;
}

.sensor-card {
    padding: 14px;

    border:
        1px solid #303034;

    border-radius: 12px;

    background: #0f0f11;
}

.sensor-label {
    color: #71717a;

    font-size: 12px;
}

.sensor-value {
    margin-top: 5px;

    font-size: 20px;
    font-weight: 700;
}


/* =====================================================
   LOG
===================================================== */

.log {
    max-height: 190px;

    overflow-y: auto;

    padding: 11px;

    border:
        1px solid #303034;

    border-radius: 10px;

    background: #070708;

    color: #a1a1aa;

    font-family: monospace;

    font-size: 10px;

    white-space: pre-wrap;
}


/* =====================================================
   COMMAND CARD
===================================================== */

.command-card {
    margin-top: 9px;

    padding: 13px;

    border:
        1px solid #303034;

    border-radius: 12px;

    background: #101012;
}

.command-card-name {
    font-weight: 700;
}

.command-card-trigger {
    margin-top: 5px;

    color: #71717a;

    font-size: 12px;
}

.command-card-action {
    margin-top: 5px;

    color: #10a37f;

    font-size: 12px;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 700px) {

    .sidebar {
        display: none;
    }

    .topbar {
        height:
            calc(
                56px +
                env(safe-area-inset-top)
            );

        padding:
            env(safe-area-inset-top)
            14px
            0;
    }

    .chat {
        padding:
            12px 13px
            calc(
                145px +
                env(safe-area-inset-bottom)
            );
    }

    .message {
        gap: 10px;

        padding:
            13px 1px;
    }

    .avatar {
        width: 32px;
        height: 32px;

        min-width: 32px;

        border-radius: 9px;
    }

    .message-content {
        font-size: 15px;
    }

    .input-area {
        left: 0;
        right: 0;

        bottom: 62px;

        padding:
            8px 10px;

        background:
            linear-gradient(
                transparent,
                #09090b 25%
            );
    }

    .input-box {
        border-radius: 16px;

        padding: 6px;
    }

    .input-box input {
        padding:
            10px 8px;

        font-size: 15px;
    }

    .send {
        width: 42px;
        height: 42px;
    }

    .mobile-nav {
        position: fixed;

        display: flex;

        left: 0;
        right: 0;
        bottom: 0;

        height:
            calc(
                62px +
                env(safe-area-inset-bottom)
            );

        padding-bottom:
            env(safe-area-inset-bottom);

        z-index: 50;

        background:
            rgba(20,20,23,.94);

        border-top:
            1px solid #303034;

        backdrop-filter:
            blur(18px);
    }

    .nav-button {
        flex: 1;

        min-width: 0;

        display: flex;
        flex-direction: column;

        align-items: center;
        justify-content: center;

        gap: 3px;

        border: 0;

        background: transparent;

        color: #71717a;

        font-size: 11px;

        cursor: pointer;
    }

    .nav-button .icon {
        font-size: 21px;

        line-height: 1;
    }

    .nav-button.active {
        color: #10a37f;
    }

    .nav-button:active {
        transform: scale(.94);
    }

    .modal {
        align-items: flex-end;

        padding: 0;
    }

    .modal-box {
        max-width: none;

        max-height: 88dvh;

        padding:
            20px 16px
            calc(
                20px +
                env(safe-area-inset-bottom)
            );

        border:
            1px solid #303034;

        border-bottom: 0;

        border-radius:
            23px 23px 0 0;

        animation:
            sheetUp .2s ease-out;
    }

    .modal-title {
        font-size: 19px;
    }

    .modal-buttons {
        position: sticky;

        bottom: 0;

        padding-top: 10px;

        background: #18181b;
    }

    .modal-buttons .btn {
        flex: 1;
    }

    .connect-button {
        min-height: 50px;

        font-size: 15px;
    }

}


/* =====================================================
   SMALL PHONE
===================================================== */

@media (max-width: 380px) {

    .chat {
        padding-left: 10px;
        padding-right: 10px;
    }

    .message-content {
        font-size: 14px;
    }

    .sensor-value {
        font-size: 17px;
    }

}


/* =====================================================
   ANIMATION
===================================================== */

@keyframes sheetUp {

    from {
        transform:
            translateY(100%);
    }

    to {
        transform:
            translateY(0);
    }

}

</style>
</head>


<body>


<div class="app">


    <!-- =================================================
         DESKTOP SIDEBAR
    ================================================== -->

    <aside class="sidebar">

        <div class="logo">
            🤖 micro:bit AI
        </div>


        <button
            class="new-chat"
            onclick="newChat()">

            ＋ 새 채팅

        </button>


        <div class="sidebar-section">
            명령
        </div>


        <div
            class="command-list"
            id="commandList">
        </div>


        <div class="sidebar-bottom">

            <button
                class="sidebar-button"
                onclick="openDeviceModal()">

                📡 micro:bit 연결

            </button>


            <button
                class="sidebar-button"
                onclick="openCommandManager()">

                ⚙️ 명령 관리

            </button>


            <button
                class="sidebar-button"
                onclick="openSensorModal()">

                📊 센서

            </button>


            <button
                class="sidebar-button"
                onclick="openLogModal()">

                📝 BLE 로그

            </button>

        </div>

    </aside>


    <!-- =================================================
         MAIN
    ================================================== -->

    <main class="main">


        <header class="topbar">

            <div class="title">
                🤖 micro:bit AI
            </div>


            <div class="connection">

                <div
                    class="dot"
                    id="connectionDot">
                </div>


                <span id="connectionText">
                    연결 안 됨
                </span>

            </div>

        </header>


        <!-- =================================================
             CHAT
        ================================================== -->

        <section
            class="chat"
            id="chat">

            <div class="message bot-message">

                <div class="avatar bot-avatar">
                    🤖
                </div>


                <div class="message-content">
                    안녕하세요! 👋

                    저는 micro:bit를
                    조종하는 AI예요.

                    "하트 보여줘"
                    "불 켜줘"
                    "온도 알려줘"

                    처럼 말해보세요! ✨
                </div>

            </div>

        </section>


        <!-- =================================================
             INPUT
        ================================================== -->

        <div class="input-area">

            <div class="input-box">

                <input
                    id="chatInput"
                    autocomplete="off"
                    placeholder="micro:bit에게 말해보세요..."
                    onkeydown="handleEnter(event)"
                >


                <button
                    class="send"
                    onclick="sendChat()">

                    ↑

                </button>

            </div>

        </div>

    </main>

</div>


<!-- =====================================================
     MOBILE NAV
====================================================== -->

<nav class="mobile-nav">


    <button
        class="nav-button active"
        onclick="newChat()">

        <span class="icon">
            💬
        </span>

        채팅

    </button>


    <button
        class="nav-button"
        onclick="openDeviceModal()">

        <span class="icon">
            📡
        </span>

        연결

    </button>


    <button
        class="nav-button"
        onclick="openSensorModal()">

        <span class="icon">
            📊
        </span>

        센서

    </button>


    <button
        class="nav-button"
        onclick="openCommandManager()">

        <span class="icon">
            ⚙️
        </span>

        명령

    </button>


    <button
        class="nav-button"
        onclick="openLogModal()">

        <span class="icon">
            📝
        </span>

        로그

    </button>

</nav>


<!-- =====================================================
     DEVICE MODAL
====================================================== -->

<div
    class="modal"
    id="deviceModal">

    <div class="modal-box">


        <div class="modal-title">
            📡 micro:bit 연결
        </div>


        <div
            style="
                color:#a1a1aa;
                font-size:13px;
                line-height:1.5;
            ">

            Bluetooth 기기를 검색해서
            micro:bit에 연결합니다.

        </div>


        <div class="device-info">

            <div
                class="device-name"
                id="deviceName">

                연결된 기기 없음

            </div>


            <div
                class="device-id"
                id="deviceId">

                -

            </div>

        </div>


        <button
            class="connect-button"
            onclick="connectBluetooth()">

            🔎 Bluetooth 기기 검색

        </button>


        <button
            class="connect-button"
            style="background:#3f3f46"
            onclick="disconnectBluetooth()">

            ❌ 연결 해제

        </button>


        <div
            class="log"
            id="bleLog"
            style="margin-top:12px">

        </div>


        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeDeviceModal()">

                닫기

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     COMMAND MANAGER
====================================================== -->

<div
    class="modal"
    id="commandModal">

    <div class="modal-box">


        <div class="modal-title">
            ⚙️ 명령 관리
        </div>


        <button
            class="btn btn-green"
            style="width:100%"
            onclick="openAddCommand()">

            ＋ 새 명령 추가

        </button>


        <div
            id="commandManagerList"
            style="margin-top:14px">

        </div>


        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeCommandManager()">

                닫기

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     ADD COMMAND
====================================================== -->

<div
    class="modal"
    id="addCommandModal">

    <div class="modal-box">


        <div class="modal-title">
            ＋ 새 명령
        </div>


        <div class="field">

            <label>
                명령 이름
            </label>

            <input
                id="commandName"
                placeholder="예: 생일 축하">

        </div>


        <div class="field">

            <label>
                사용자가 말할 표현
            </label>

            <input
                id="commandTriggers"
                placeholder="생일 축하, 축하해, 생일">

        </div>


        <div class="field">

            <label>
                micro:bit 동작
            </label>

            <select id="commandAction">

                <option value="HELLO">
                    👋 HELLO
                </option>

                <option value="HEART">
                    ❤️ HEART
                </option>

                <option value="WHAT">
                    ❓ WHAT
                </option>

                <option value="DANCE">
                    💃 DANCE
                </option>

                <option value="BEEP">
                    🔊 BEEP
                </option>

                <option value="LED_ON">
                    💡 LED ON
                </option>

                <option value="LED_OFF">
                    🌑 LED OFF
                </option>

                <option value="TEMP">
                    🌡️ TEMP
                </option>

                <option value="LIGHT">
                    ☀️ LIGHT
                </option>

                <option value="SOUND">
                    🔊 SOUND
                </option>

                <option value="SENSOR">
                    📊 SENSOR
                </option>

                <option value="PING">
                    📡 PING
                </option>

            </select>

        </div>


        <div class="field">

            <label>
                AI 답변
            </label>

            <textarea
                id="commandResponse"
                placeholder="🎉 생일 축하해!">
            </textarea>

        </div>


        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeAddCommand()">

                취소

            </button>


            <button
                class="btn btn-green"
                onclick="saveCommand()">

                저장

            </button>

        </div>

    </div>

</div>


<!-- =====================================================
     SENSOR
====================================================== -->

<div
    class="modal"
    id="sensorModal">

    <div class="modal-box">


        <div class="modal-title">
            📊 센서
        </div>


        <div class="sensor-grid">


            <div class="sensor-card">

                <div class="sensor-label">
                    🌡️ 온도
                </div>

                <div
                    class="sensor-value"
                    id="temperature">

                    --

                </div>

            </div>


            <div class="sensor-card">

                <div class="sensor-label">
                    ☀️ 빛
                </div>

                <div
                    class="sensor-value"
                    id="light">

                    --

                </div>

            </div>


            <div class="sensor-card">

                <div class="sensor-label">
                    🔊 소리
                </div>

                <div
                    class="sensor-value"
                    id="sound">

                    --

                </div>

            </div>


            <div class="sensor-card">

                <div class="sensor-label">
                    ↔️ X
                </div>

                <div
                    class="sensor-value"
                    id="accelX">

                    --

                </div>

            </div>


            <div class="sensor-card">

                <div class="sensor-label">
                    ↕️ Y
                </div>

/* =====================================================
   COMMAND PROCESSOR
===================================================== */

async function processChat(
    text
) {

    const normalized =
        text
        .toLowerCase()
        .trim();


    const commands =
        getAllCommands();


    for (
        const command of commands
    ) {

        for (
            const trigger
            of command.triggers
        ) {

            if (
                normalized.includes(
                    trigger.toLowerCase()
                )
            ) {

                addBotMessage(
                    command.response
                );


                await sendCommand(
                    command.action
                );


                return;

            }

        }

    }


    addBotMessage(
        "🤔 아직 그 명령은 몰라요.\n\n" +
        "예:\n" +
        "• 하트 보여줘\n" +

/* =====================================================
   CONNECT
===================================================== */

async function connectBluetooth() {

    try {

        if (
            !navigator.bluetooth
        ) {

            addBotMessage(
                "❌ 이 브라우저에서는 Web Bluetooth를 사용할 수 없어요."
            );

            return;

        }


        bleLog(
            "🔎 Bluetooth 검색 시작..."
        );


        /*
         * 중요:
         *
         * filters를 사용하지 않고
         * 모든 BLE 장치를 검색합니다.
         *
         * 필요한 UART 서비스는
         * optionalServices에 등록합니다.
         */

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices:
                    true,

                optionalServices:[
                    SERVICE_UUID
                ]

            });


        const name =
            bluetoothDevice.name ||
            "이름 없는 BLE 장치";


        bleLog(
            "✅ 선택됨: " +
            name
        );


        document.getElementById(
            "deviceName"
        ).textContent =
            name;


        document.getElementById(
            "deviceId"
        ).textContent =
            bluetoothDevice.id ||
            "-";


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        bleLog(
            "🔗 GATT 연결 중..."
        );


        gattServer =
            await bluetoothDevice.gatt.connect();


        bleLog(
            "✅ GATT 연결 성공"
        );


        const service =
            await gattServer.getPrimaryService(
                SERVICE_UUID
            );


        bleLog(
            "✅ UART 서비스 발견"
        );


        /*
         * micro:bit → S25
         *
         * 002 = INDICATE
         */

        rxCharacteristic =
            await service.getCharacteristic(
                RX_UUID
            );


        bleLog(
            "✅ RX 발견: " +
            RX_UUID
        );


        /*
         * S25 → micro:bit
         *
         * 003 = WRITE / WRITE_NO_RESPONSE
         */

        txCharacteristic =
            await service.getCharacteristic(
                TX_UUID
            );


        bleLog(
            "✅ TX 발견: " +
            TX_UUID
        );


        /*
         * 현재 장치에서 002가 INDICATE이므로
         * startNotifications()를 사용합니다.
         *
         * 브라우저가 해당 characteristic의
         * 변경 이벤트를 처리합니다.
         */

        await rxCharacteristic.startNotifications();


        rxCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleBluetoothData
        );


        bleLog(
            "📡 수신 활성화"
        );


        document.getElementById(
            "connectionDot"
        ).classList.add(
            "connected"
        );


        document.getElementById(
            "connectionText"
        ).textContent =
            name;


        addBotMessage(
            "🟢 " +
            name +
            " 연결 완료!"
        );


        await sendCommand(
            "PING"
        );


    } catch(error) {

        bleLog(
            "❌ " +
            error.name +
            ": " +
            error.message
        );


        console.error(
            "Bluetooth error:",
            error
        );


        if (
            error.name ===
            "NotFoundError"
        ) {

            addBotMessage(
                "🔎 Bluetooth 기기 선택이 취소됐어요."
            );

        } else {

            addBotMessage(
                "❌ Bluetooth 연결 실패\n\n" +
                error.name +
                ": " +
                error.message
            );

        }

    }

}

function disconnectBluetooth() {

        if (

/* =====================================================
   RECEIVE
===================================================== */

function handleBluetoothData(
    event
) {

    const value =
        new TextDecoder(
            "utf-8"
        ).decode(
            event.target.value
        );


    bleLog(
        "⬅️ RX: " +
        value.trim()
    );


    receivedBuffer += value;


    const lines =
        receivedBuffer.split(
            "\n"
        );


    receivedBuffer =
        lines.pop() || "";


    for (
        const line of lines
    ) {

        const data =
            line.trim();


        if (
            data
        ) {

            processReceivedData(
                data
            );

        }

    }

}


/* =====================================================
   DATA PROCESSING
===================================================== */

function processReceivedData(
    data
) {

    /*
     * 센서:
     *
     * DATA,temp,light,sound,x,y,z,a,b
     */

    if (
        data.startsWith(
            "DATA,"
        )
    ) {

        const parts =
            data.split(",");


        if (
            parts.length >= 7
        ) {

            document.getElementById(
                "temperature"
            ).textContent =
                parts[1];


            document.getElementById(
                "light"
            ).textContent =
                parts[2];


            document.getElementById(
                "sound"
            ).textContent =
                parts[3];


            document.getElementById(
                "accelX"
            ).textContent =
                parts[4];


            document.getElementById(
                "accelY"
            ).textContent =
                parts[5];


            document.getElementById(
                "accelZ"
            ).textContent =
                parts[6];

        }


        return;

    }


    /*
     * micro:bit가 받은 명령
     */

    if (
        data.startsWith(
            "RECEIVED,"
        )
    ) {

        addBotMessage(
            "micro:bit 📥\n" +
            data.substring(9)
        );


        return;

    }


    /*
     * 명령 결과
     */

    if (
        data.startsWith(
            "RESULT,"
        )
    ) {

        addBotMessage(
            "micro:bit 결과 📡\n" +
            data.substring(7)
        );


        return;

    }


    /*
     * PING
     */

    if (
        data === "PONG" ||
        data === "PING_OK"
    ) {

        addBotMessage(
            "📡 micro:bit 응답: PONG 🟢"
        );


        return;

    }


    /*
     * 기타 데이터
     */

    addBotMessage(
        "micro:bit 📥\n" +
        data
    );

}


/* =====================================================
   SEND COMMAND
===================================================== */

async function sendCommand(
    command
) {

    if (
        !txCharacteristic
    ) {

        addBotMessage(
            "🔵 먼저 micro:bit를 연결해주세요."
        );


        return false;

    }


    try {

        const data =
            new TextEncoder()
            .encode(
                command +
                "\n"
            );


        /*
         * 003 characteristic:
         *
         * WRITE
         * WRITE_NO_RESPONSE
         */

        if (
            txCharacteristic
                .properties
                .writeWithoutResponse
        ) {

            await txCharacteristic
                .writeValueWithoutResponse(
                    data
                );

        } else {

            await txCharacteristic
                .writeValue(
                    data
                );

        }


        bleLog(
            "➡️ TX: " +
            command
        );


        return true;

    } catch(error) {

        bleLog(
            "❌ TX 오류: " +
            error.name +
            ": " +
            error.message
        );


        return false;

    }

}

function saveCommand() {

    const name =
        document.getElementById(
            "commandName"
        ).value.trim();


    const triggerText =
        document.getElementById(
            "commandTriggers"
        ).value.trim();


    const action =
        document.getElementById(
            "commandAction"
        ).value;


    const response =
        document.getElementById(
            "commandResponse"
        ).value.trim();


    if (!name) {

        alert(
            "명령 이름을 입력해주세요."
        );

        return;

    }


    if (!triggerText) {

        alert(
            "사용자 표현을 입력해주세요."
        );

        return;

    }


    const triggers =
        triggerText
        .split(",")
        .map(
            x => x.trim()
        )
        .filter(
            Boolean
        );


    const commands =
        getCustomCommands();


    commands.push({

        name,

        triggers,

        action,

        response:
            response ||
            "명령을 실행했어요! 🤖"

    });


    saveCustomCommands(
        commands
    );


    closeAddCommand();

    refreshCommandList();

    renderCommandManager();


    addBotMessage(
        `⚙️ "${name}" 명령을 추가했어요!`
    );

}


/* =====================================================
   DELETE COMMAND
===================================================== */

function deleteCommand(
    index
) {

    const commands =
        getCustomCommands();


    const command =
        commands[index];


    if (!command) {
        return;
    }


    if (
        !confirm(
            `"${command.name}" 명령을 삭제할까요?`
        )
    ) {

        return;

    }


    commands.splice(
        index,
        1
    );


    saveCustomCommands(
        commands
    );


    refreshCommandList();

    renderCommandManager();

}


/* =====================================================
   HTML ESCAPE
===================================================== */

function escapeHtml(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}
