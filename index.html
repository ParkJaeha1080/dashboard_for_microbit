<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>micro:bit AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: #f5f5f7;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    height: 100vh;
    overflow: hidden;
}

button,
input,
textarea,
select {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================
   APP
========================= */

.app {
    height: 100vh;
    display: flex;
    flex-direction: column;
}

/* =========================
   HEADER
========================= */

.header {
    height: 60px;

    display: flex;
    align-items: center;

    padding: 0 15px;

    border-bottom: 1px solid #29292f;

    background: #111116;
}

.logo {
    font-size: 19px;
    font-weight: 700;
}

.status {
    margin-left: auto;

    display: flex;
    align-items: center;

    gap: 7px;

    color: #999;

    font-size: 12px;
}

.status-dot {
    width: 9px;
    height: 9px;

    border-radius: 50%;

    background: #666;
}

.status-dot.connected {
    background: #45d483;
}

.header-button {
    margin-left: 8px;

    border: 1px solid #35353d;

    background: #222229;
    color: white;

    padding: 7px 11px;

    border-radius: 16px;

    font-size: 12px;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;

    overflow-y: auto;

    padding: 20px 13px 130px;
}

.message-row {
    display: flex;

    margin-bottom: 18px;
}

.message-row.user {
    justify-content: flex-end;
}

.message-row.bot {
    justify-content: flex-start;
}

.avatar {
    width: 34px;
    height: 34px;

    flex-shrink: 0;

    margin-right: 8px;

    border-radius: 50%;

    background: #29292f;

    display: flex;
    align-items: center;
    justify-content: center;
}

.message {
    max-width: min(82%, 550px);

    padding: 11px 14px;

    border-radius: 18px;

    font-size: 15px;

    line-height: 1.5;

    white-space: pre-wrap;

    word-break: break-word;
}

.bot .message {
    background: #1b1b21;

    border-top-left-radius: 5px;
}

.user .message {
    background: #303038;

    border-top-right-radius: 5px;
}

/* =========================
   INPUT
========================= */

.input-area {
    position: fixed;

    left: 0;
    right: 0;
    bottom: 0;

    padding: 7px 10px 13px;

    background:
        linear-gradient(
            transparent,
            #0b0b0f 20%
        );
}

.quick {
    max-width: 800px;

    margin: 0 auto 7px;

    display: flex;

    gap: 6px;

    overflow-x: auto;

    scrollbar-width: none;
}

.quick::-webkit-scrollbar {
    display: none;
}

.quick button {
    flex-shrink: 0;

    padding: 7px 11px;

    border-radius: 15px;

    border: 1px solid #303038;

    background: #19191e;

    color: #ddd;
}

.input-box {
    max-width: 800px;

    margin: auto;

    display: flex;

    align-items: flex-end;

    gap: 7px;

    padding: 8px;

    border: 1px solid #34343b;

    border-radius: 25px;

    background: #1b1b20;
}

textarea {
    flex: 1;

    min-height: 25px;
    max-height: 120px;

    resize: none;

    border: 0;
    outline: 0;

    background: transparent;

    color: white;

    padding: 7px 8px;

    font-size: 15px;
}

.send {
    width: 40px;
    height: 40px;

    flex-shrink: 0;

    border: 0;

    border-radius: 50%;

    background: white;

    color: black;

    font-size: 19px;
}

/* =========================
   MODAL
========================= */

.modal {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background: rgba(0,0,0,.7);

    align-items: center;
    justify-content: center;

    padding: 15px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: min(500px, 100%);

    max-height: 90vh;

    overflow-y: auto;

    border: 1px solid #34343c;

    border-radius: 18px;

    background: #18181d;

    padding: 18px;
}

.modal-title {
    font-size: 19px;

    font-weight: 700;

    margin-bottom: 18px;
}

.form-label {
    display: block;

    color: #aaa;

    font-size: 12px;

    margin: 13px 0 6px;
}

.form-input,
.form-select {
    width: 100%;

    border: 1px solid #36363e;

    outline: none;

    border-radius: 10px;

    padding: 11px;

    background: #101014;

    color: white;

    font-size: 14px;
}

.form-help {
    color: #777;

    font-size: 11px;

    margin-top: 5px;

    line-height: 1.4;
}

.modal-buttons {
    display: flex;

    gap: 8px;

    margin-top: 18px;
}

.modal-buttons button {
    flex: 1;

    padding: 11px;

    border: 0;

    border-radius: 10px;
}

.save-button {
    background: white;

    color: black;
}

.cancel-button {
    background: #292930;

    color: white;
}

/* =========================
   COMMAND MANAGER
========================= */

.command-list {
    margin-top: 15px;
}

.command-item {
    display: flex;

    align-items: center;

    gap: 10px;

    padding: 11px;

    margin-bottom: 8px;

    border: 1px solid #303038;

    border-radius: 12px;

    background: #111116;
}

.command-icon {
    width: 38px;
    height: 38px;

    border-radius: 10px;

    background: #24242b;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;
}

.command-info {
    flex: 1;

    min-width: 0;
}

.command-name {
    font-size: 14px;

    font-weight: 600;
}

.command-trigger {
    color: #888;

    font-size: 11px;

    margin-top: 3px;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.delete-command {
    background: #2b1c1f;

    color: #ff8585;

    border: 0;

    border-radius: 8px;

    padding: 7px 9px;
}

/* =========================
   DEVICE PANEL
========================= */

.panel {
    display: none;

    position: fixed;

    z-index: 50;

    top: 68px;
    right: 10px;

    width: 290px;

    max-width: calc(100vw - 20px);

    border: 1px solid #34343b;

    border-radius: 15px;

    background: #18181d;

    padding: 14px;
}

.panel.show {
    display: block;
}

.panel-title {
    font-weight: 700;

    margin-bottom: 12px;
}

.sensor-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 7px;
}

.sensor-card {
    background: #222229;

    border-radius: 9px;

    padding: 9px;
}

.sensor-name {
    color: #888;

    font-size: 11px;
}

.sensor-value {
    margin-top: 3px;

    font-size: 16px;

    font-weight: 600;
}

.logs {
    margin-top: 10px;

    max-height: 130px;

    overflow-y: auto;

    padding: 8px;

    border-radius: 8px;

    background: #0c0c10;

    color: #888;

    font-size: 10px;

    white-space: pre-wrap;
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <div class="logo">
            🤖 micro:bit AI
        </div>

        <div class="status">

            <span
                id="statusDot"
                class="status-dot"
            ></span>

            <span id="statusText">
                연결 안 됨
            </span>

            <button
                class="header-button"
                onclick="connectMicrobit()"
            >
                📡 연결
            </button>

            <button
                class="header-button"
                onclick="togglePanel()"
            >
                📊
            </button>

            <button
                class="header-button"
                onclick="openCommandManager()"
            >
                ⚙️
            </button>

        </div>

    </div>


    <!-- CHAT -->

    <div
        id="chat"
        class="chat"
    ></div>


    <!-- DEVICE PANEL -->

    <div
        id="devicePanel"
        class="panel"
    >

        <div class="panel-title">
            📡 micro:bit 상태
        </div>

        <div class="sensor-grid">

            <div class="sensor-card">
                <div class="sensor-name">
                    온도
                </div>

                <div
                    id="temp"
                    class="sensor-value"
                >
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-name">
                    밝기
                </div>

                <div
                    id="light"
                    class="sensor-value"
                >
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-name">
                    소리
                </div>

                <div
                    id="sound"
                    class="sensor-value"
                >
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-name">
                    X
                </div>

                <div
                    id="accelX"
                    class="sensor-value"
                >
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-name">
                    Y
                </div>

                <div
                    id="accelY"
                    class="sensor-value"
                >
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-name">
                    Z
                </div>

                <div
                    id="accelZ"
                    class="sensor-value"
                >
                    --
                </div>
            </div>

        </div>

        <div
            id="logs"
            class="logs"
        ></div>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <div class="quick">

            <button
                onclick="quickCommand('뭐하지?')"
            >
                🎲 뭐하지?
            </button>

            <button
                onclick="quickCommand('하트')"
            >
                ❤️ 하트
            </button>

            <button
                onclick="quickCommand('춤춰')"
            >
                💃 춤
            </button>

            <button
                onclick="quickCommand('온도')"
            >
                🌡️ 온도
            </button>

            <button
                onclick="quickCommand('센서')"
            >
                📊 센서
            </button>

        </div>

        <div class="input-box">

            <textarea
                id="input"
                placeholder="micro:bit에게 메시지를 보내세요..."
                rows="1"
            ></textarea>

            <button
                class="send"
                onclick="sendChat()"
            >
                ↑
            </button>

        </div>

    </div>

</div>


<!-- COMMAND MANAGER -->

<div
    id="commandModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-title">
            ⚙️ 명령 관리
        </div>

        <button
            class="save-button"
            style="
                width:100%;
                padding:11px;
                border-radius:10px;
                border:0;
            "
            onclick="openAddCommand()"
        >
            ＋ 새 명령 만들기
        </button>

        <div
            id="commandList"
            class="command-list"
        ></div>

        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="closeCommandManager()"
            >
                닫기
            </button>

        </div>

    </div>

</div>


<!-- ADD COMMAND -->

<div
    id="addModal"
    class="modal"
>

    <div class="modal-box">

        <div class="modal-title">
            ＋ 새 명령 만들기
        </div>

        <label class="form-label">
            명령 이름
        </label>

        <input
            id="commandName"
            class="form-input"
            placeholder="예: 선풍기 켜기"
        >

        <label class="form-label">
            사용자가 말할 문장
        </label>

        <input
            id="commandTriggers"
            class="form-input"
            placeholder="선풍기 켜줘, 선풍기 켜, 바람 켜줘"
        >

        <div class="form-help">
            여러 문장은 쉼표(,)로 구분하세요.
        </div>

        <label class="form-label">
            micro:bit 동작
        </label>

        <select
            id="commandAction"
            class="form-select"
        >

            <option value="HELLO">
                😊 인사
            </option>

            <option value="HEART">
                ❤️ 하트
            </option>

            <option value="WHAT">
                🎲 랜덤 행동
            </option>

            <option value="DANCE">
                💃 춤
            </option>

            <option value="BEEP">
                🔊 소리
            </option>

            <option value="LED_ON">
                💡 LED 켜기
            </option>

            <option value="LED_OFF">
                🌑 LED 끄기
            </option>

            <option value="TEMP">
                🌡️ 온도
            </option>

            <option value="LIGHT">
                💡 밝기
            </option>

            <option value="SOUND">
                🔊 소리 센서
            </option>

            <option value="SENSOR">
                📊 전체 센서
            </option>

            <option value="PING">
                📡 연결 테스트
            </option>

        </select>

        <label class="form-label">
            AI 응답
        </label>

        <input
            id="commandResponse"
            class="form-input"
            placeholder="예: 🌀 선풍기를 켰어요!"
        >

        <div class="form-help">
            명령 실행 후 채팅창에 표시될 문장입니다.
        </div>

        <div class="modal-buttons">

            <button
                class="cancel-button"
                onclick="closeAddCommand()"
            >
                취소
            </button>

            <button
                class="save-button"
                onclick="saveNewCommand()"
            >
                저장
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   BLE
========================================================= */

const UART_SERVICE =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e"

const RX_CHARACTERISTIC =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e"

const TX_CHARACTERISTIC =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e"


let device = null
let server = null
let rx = null
let tx = null

let receiveBuffer = ""

const decoder =
    new TextDecoder("utf-8")

const encoder =
    new TextEncoder()


/* =========================================================
   기본 명령
========================================================= */

const DEFAULT_COMMANDS = [

    {
        name: "인사",
        triggers: [
            "안녕",
            "안녕하세요",
            "hello",
            "hi"
        ],
        action: "HELLO",
        response: "😊 안녕하세요!"
    },

    {
        name: "하트",
        triggers: [
            "하트",
            "하트 보여줘",
            "사랑"
        ],
        action: "HEART",
        response: "❤️ 하트를 보여줄게!"
    },

    {
        name: "랜덤",
        triggers: [
            "뭐하지?",
            "뭐하지",
            "뭐 할까?",
            "뭐 할까",
            "재미있는 거",
            "재미있는거",
            "랜덤"
        ],
        action: "WHAT",
        response: "🎲 좋아! 랜덤 행동을 골라볼게!"
    },

    {
        name: "춤",
        triggers: [
            "춤",
            "춤춰",
            "춤 춰"
        ],
        action: "DANCE",
        response: "💃 춤춰볼게!"
    },

    {
        name: "삐",
        triggers: [
            "삐",
            "삐 소리",
            "소리 내"
        ],
        action: "BEEP",
        response: "🔊 삐 소리를 낼게!"
    },

    {
        name: "LED 켜기",
        triggers: [
            "불 켜",
            "불켜",
            "불 켜줘"
        ],
        action: "LED_ON",
        response: "💡 불을 켰어요!"
    },

    {
        name: "LED 끄기",
        triggers: [
            "불 꺼",
            "불꺼",
            "불 꺼줘"
        ],
        action: "LED_OFF",
        response: "🌑 불을 껐어요!"
    },

    {
        name: "온도",
        triggers: [
            "온도",
            "온도 알려줘",
            "몇 도야"
        ],
        action: "TEMP",
        response: "🌡️ 온도를 확인할게요!"
    },

    {
        name: "밝기",
        triggers: [
            "밝기",
            "빛",
            "밝기 알려줘"
        ],
        action: "LIGHT",
        response: "💡 밝기를 확인할게요!"
    },

    {
        name: "소리",
        triggers: [
            "소리",
            "소리 알려줘"
        ],
        action: "SOUND",
        response: "🔊 소리 크기를 확인할게요!"
    },

    {
        name: "센서",
        triggers: [
            "센서",
            "센서 정보",
            "센서 상태",
            "센서 알려줘"
        ],
        action: "SENSOR",
        response: "📊 센서 정보를 가져올게요!"
    }

]


/* =========================================================
   저장된 명령 불러오기
========================================================= */

let customCommands = []

try {

    const saved =
        localStorage.getItem(
            "microbit_custom_commands"
        )

    if (saved) {

        customCommands =
            JSON.parse(saved)

    }

} catch (error) {

    console.log(error)

}


/* =========================================================
   모든 명령
========================================================= */

function getAllCommands() {

    return [
        ...DEFAULT_COMMANDS,
        ...customCommands
    ]

}


/* =========================================================
   채팅 메시지
========================================================= */

function addMessage(
    text,
    type = "bot"
) {

    const chat =
        document.getElementById("chat")

    const row =
        document.createElement("div")

    row.className =
        "message-row " + type

    if (type === "bot") {

        const avatar =
            document.createElement("div")

        avatar.className =
            "avatar"

        avatar.textContent =
            "🤖"

        row.appendChild(
            avatar
        )

    }

    const message =
        document.createElement("div")

    message.className =
        "message"

    message.textContent =
        text

    row.appendChild(
        message
    )

    chat.appendChild(
        row
    )

    chat.scrollTop =
        chat.scrollHeight
}


/* =========================================================
   로그
========================================================= */

function log(text) {

    const logs =
        document.getElementById("logs")

    const time =
        new Date()
            .toLocaleTimeString()

    logs.textContent +=
        "[" + time + "] " +
        text +
        "\n"

    logs.scrollTop =
        logs.scrollHeight
}


/* =========================================================
   BLE 연결
========================================================= */

async function connectMicrobit() {

    try {

        addMessage(
            "📡 micro:bit를 찾고 있어요..."
        )

        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        services: [
                            UART_SERVICE
                        ]
                    }
                ]

            })

        log(
            "장치 선택: " +
            device.name
        )

        device.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        )

        server =
            await device.gatt.connect()

        const service =
            await server.getPrimaryService(
                UART_SERVICE
            )

        rx =
            await service.getCharacteristic(
                RX_CHARACTERISTIC
            )

        tx =
            await service.getCharacteristic(
                TX_CHARACTERISTIC
            )

        await rx.startNotifications()

        rx.addEventListener(
            "characteristicvaluechanged",
            handleNotification
        )

        document
            .getElementById("statusDot")
            .classList
            .add("connected")

        document
            .getElementById("statusText")
            .textContent =
            "연결됨"

        addMessage(
            "✅ micro:bit와 연결됐어요!\n무엇을 해볼까요?"
        )

        log("BLE 연결 완료")

    } catch (error) {

        console.error(error)

        log(
            "연결 오류: " +
            error.message
        )

        addMessage(
            "❌ 연결에 실패했어요.\n" +
            error.message
        )

    }
}


/* =========================================================
   연결 해제
========================================================= */

function onDisconnected() {

    document
        .getElementById("statusDot")
        .classList
        .remove("connected")

    document
        .getElementById("statusText")
        .textContent =
        "연결 안 됨"

    rx = null
    tx = null

    log(
        "micro:bit 연결 해제"
    )

    addMessage(
        "⚠️ micro:bit 연결이 끊어졌어요."
    )
}


/* =========================================================
   micro:bit 데이터 수신
========================================================= */

function handleNotification(event) {

    const value =
        event.target.value

    const text =
        decoder.decode(value)

    receiveBuffer +=
        text

    let lines =
        receiveBuffer.split("\n")

    receiveBuffer =
        lines.pop()

    for (
        const line of lines
    ) {

        const clean =
            line
                .replace(/\r/g, "")
                .trim()

        if (
            clean.length > 0
        ) {

            processIncoming(
                clean
            )

        }

    }

}


/* =========================================================
   micro:bit 응답 처리
========================================================= */

function processIncoming(line) {

    log(
        "RX: " +
        line
    )

    const parts =
        line.split(",")

    const type =
        parts[0]

    if (
        type === "DATA"
    ) {

        updateSensor(
            parts
        )

        return
    }

    if (
        type === "TEMP"
    ) {

        addMessage(
            "🌡️ 현재 온도는 " +
            parts[1] +
            "°C예요."
        )

        return
    }

    if (
        type === "LIGHT"
    ) {

        addMessage(
            "💡 현재 밝기는 " +
            parts[1] +
            "이에요."
        )

        return
    }

    if (
        type === "SOUND"
    ) {

        addMessage(
            "🔊 현재 소리 크기는 " +
            parts[1] +
            "이에요."
        )

        return
    }

    if (
        type === "RESULT"
    ) {

        handleResult(
            parts.slice(1).join(",")
        )

        return
    }

    if (
        type === "BUTTON"
    ) {

        if (
            parts[1] === "A"
        ) {

            addMessage(
                "🔵 micro:bit 버튼 A가 눌렸어요!"
            )

        }

        if (
            parts[1] === "B"
        ) {

            addMessage(
                "🟢 micro:bit 버튼 B가 눌렸어요!"
            )

        }

        return
    }

    if (
        type === "RECEIVED"
    ) {

        log(
            "명령 수신: " +
            parts.slice(1).join(",")
        )

        return
    }

}


/* =========================================================
   RESULT
========================================================= */

function handleResult(result) {

    if (
        result === "PONG"
    ) {

        addMessage(
            "📡 연결 상태가 정상이에요!"
        )

    } else if (
        result === "UNKNOWN"
    ) {

        addMessage(
            "🤔 micro:bit가 이 동작을 이해하지 못했어요."
        )

    } else if (
        result === "LED_ON"
    ) {

        addMessage(
            "💡 LED를 켰어요!"
        )

    } else if (
        result === "LED_OFF"
    ) {

        addMessage(
            "🌑 LED를 껐어요!"
        )

    } else if (
        result === "HEART"
    ) {

        addMessage(
            "❤️ 하트를 표시했어요!"
        )

    } else if (
        result === "HELLO"
    ) {

        addMessage(
            "😊 micro:bit가 인사했어요!"
        )

    } else if (
        result === "DANCE"
    ) {

        addMessage(
            "💃 춤을 췄어요!"
        )

    } else if (
        result === "BEEP"
    ) {

        addMessage(
            "🔊 소리를 냈어요!"
        )

    } else if (
        result === "RANDOM"
    ) {

        addMessage(
            "🎲 랜덤 동작을 실행했어요!"
        )

    } else {

        addMessage(
            "🤖 micro:bit: " +
            result
        )

    }

}


/* =========================================================
   센서
========================================================= */

function updateSensor(parts) {

    if (
        parts.length < 9
    ) {

        return
    }

    document
        .getElementById("temp")
        .textContent =
        parts[1] + "°C"

    document
        .getElementById("light")
        .textContent =
        parts[2]

    document
        .getElementById("sound")
        .textContent =
        parts[3]

    document
        .getElementById("accelX")
        .textContent =
        parts[4]

    document
        .getElementById("accelY")
        .textContent =
        parts[5]

    document
        .getElementById("accelZ")
        .textContent =
        parts[6]
}


/* =========================================================
   명령 찾기
========================================================= */

function findCommand(text) {

    const normalized =
        text
            .trim()
            .toLowerCase()

    const commands =
        getAllCommands()

    for (
        const command of commands
    ) {

        for (
            const trigger of command.triggers
        ) {

            if (
                normalized ===
                trigger
                    .trim()
                    .toLowerCase()
            ) {

                return command
            }

        }

    }

    return null
}


/* =========================================================
   명령 실행
========================================================= */

async function executeChat(text) {

    const command =
        findCommand(text)

    if (!command) {

        addMessage(
            "🤔 아직 이 명령을 몰라요.\n\n" +
            "⚙️ 버튼을 눌러 직접 명령을 만들어 주세요!"
        )

        return
    }

    addMessage(
        command.response
    )

    if (!tx) {

        addMessage(
            "📡 먼저 micro:bit를 연결해 주세요."
        )

        return
    }

    try {

        await sendCommand(
            command.action
        )

        log(
            "명령 실행: " +
            command.action
        )

    } catch (error) {

        console.error(error)

        addMessage(
            "❌ 명령 전송 실패: " +
            error.message
        )

    }

}


/* =========================================================
   BLE 명령 보내기
========================================================= */

async function sendCommand(command) {

    if (!tx) {

        throw new Error(
            "micro:bit가 연결되지 않았습니다."
        )
    }

    const data =
        encoder.encode(
            command + "\n"
        )

    if (
        tx.writeValueWithoutResponse
    ) {

        await tx.writeValueWithoutResponse(
            data
        )

    } else {

        await tx.writeValue(
            data
        )

    }

    log(
        "TX: " +
        command
    )
}


/* =========================================================
   채팅 보내기
========================================================= */

async function sendChat() {

    const input =
        document.getElementById(
            "input"
        )

    const text =
        input.value.trim()

    if (!text) {

        return
    }

    addMessage(
        text,
        "user"
    )

    input.value = ""

    await executeChat(
        text
    )
}


/* =========================================================
   빠른 명령
========================================================= */

function quickCommand(text) {

    const input =
        document.getElementById(
            "input"
        )

    input.value =
        text

    sendChat()
}


/* =========================================================
   명령 관리자
========================================================= */

function openCommandManager() {

    renderCommandList()

    document
        .getElementById(
            "commandModal"
        )
        .classList
        .add("show")
}

function closeCommandManager() {

    document
        .getElementById(
            "commandModal"
        )
        .classList
        .remove("show")
}


/* =========================================================
   명령 목록
========================================================= */

function renderCommandList() {

    const list =
        document.getElementById(
            "commandList"
        )

    list.innerHTML = ""

    const commands =
        getAllCommands()

    commands.forEach(
        (command, index) => {

            const item =
                document.createElement(
                    "div"
                )

            item.className =
                "command-item"

            const icon =
                document.createElement(
                    "div"
                )

            icon.className =
                "command-icon"

            icon.textContent =
                getActionIcon(
                    command.action
                )

            const info =
                document.createElement(
                    "div"
                )

            info.className =
                "command-info"

            const name =
                document.createElement(
                    "div"
                )

            name.className =
                "command-name"

            name.textContent =
                command.name

            const trigger =
                document.createElement(
                    "div"
                )

            trigger.className =
                "command-trigger"

            trigger.textContent =
                command.triggers.join(
                    " / "
                )

            info.appendChild(
                name
            )

            info.appendChild(
                trigger
            )

            item.appendChild(
                icon
            )

            item.appendChild(
                info
            )

            if (
                index >=
                DEFAULT_COMMANDS.length
            ) {

                const deleteButton =
                    document.createElement(
                        "button"
                    )

                deleteButton.className =
                    "delete-command"

                deleteButton.textContent =
                    "삭제"

                deleteButton.onclick =
                    function() {

                        deleteCustomCommand(
                            index -
                            DEFAULT_COMMANDS.length
                        )

                    }

                item.appendChild(
                    deleteButton
                )

            }

            list.appendChild(
                item
            )

        }
    )
}


/* =========================================================
   아이콘
========================================================= */

function getActionIcon(action) {

    const icons = {

        HELLO: "😊",
        HEART: "❤️",
        WHAT: "🎲",
        DANCE: "💃",
        BEEP: "🔊",
        LED_ON: "💡",
        LED_OFF: "🌑",
        TEMP: "🌡️",
        LIGHT: "💡",
        SOUND: "🔊",
        SENSOR: "📊",
        PING: "📡"

    }

    return (
        icons[action] ||
        "⚙️"
    )
}


/* =========================================================
   새 명령
========================================================= */

function openAddCommand() {

    document
        .getElementById(
            "commandName"
        )
        .value = ""

    document
        .getElementById(
            "commandTriggers"
        )
        .value = ""

    document
        .getElementById(
            "commandResponse"
        )
        .value = ""

    document
        .getElementById(
            "addModal"
        )
        .classList
        .add("show")
}

function closeAddCommand() {

    document
        .getElementById(
            "addModal"
        )
        .classList
        .remove("show")
}


/* =========================================================
   명령 저장
========================================================= */

function saveNewCommand() {

    const name =
        document
            .getElementById(
                "commandName"
            )
            .value
            .trim()

    const triggersText =
        document
            .getElementById(
                "commandTriggers"
            )
            .value
            .trim()

    const action =
        document
            .getElementById(
                "commandAction"
            )
            .value

    const response =
        document
            .getElementById(
                "commandResponse"
            )
            .value
            .trim()

    if (!name) {

        alert(
            "명령 이름을 입력하세요."
        )

        return
    }

    if (!triggersText) {

        alert(
            "사용자가 말할 문장을 입력하세요."
        )

        return
    }

    const triggers =
        triggersText
            .split(",")
            .map(
                value =>
                    value.trim()
            )
            .filter(
                value =>
                    value.length > 0
            )

    const newCommand = {

        name: name,

        triggers: triggers,

        action: action,

        response:
            response ||
            "🤖 명령을 실행했어요!"

    }

    customCommands.push(
        newCommand
    )

    localStorage.setItem(
        "microbit_custom_commands",
        JSON.stringify(
            customCommands
        )
    )

    closeAddCommand()

    renderCommandList()

    addMessage(
        "✅ 새로운 명령을 만들었어요!\n" +
        "이제 \"" +
        triggers[0] +
        "\"라고 말하면 실행됩니다."
    )
}


/* =========================================================
   명령 삭제
========================================================= */

function deleteCustomCommand(index) {

    if (
        !confirm(
            "이 명령을 삭제할까요?"
        )
    ) {

        return
    }

    customCommands.splice(
        index,
        1
    )

    localStorage.setItem(
        "microbit_custom_commands",
        JSON.stringify(
            customCommands
        )
    )

    renderCommandList()
}


/* =========================================================
   센서 패널
========================================================= */

function togglePanel() {

    document
        .getElementById(
            "devicePanel"
        )
        .classList
        .toggle("show")
}


/* =========================================================
   ENTER
========================================================= */

document
    .getElementById("input")
    .addEventListener(
        "keydown",
        function(event) {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault()

                sendChat()
            }

        }
    )
