<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>micro:bit BLE Test</title>

<style>
body {
    margin: 0;
    padding: 25px;
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
    text-align: center;
}

button {
    padding: 15px 25px;
    border: 0;
    border-radius: 12px;
    background: #2ecc71;
    color: white;
    font-size: 17px;
    font-weight: bold;
}

#log {
    margin-top: 20px;
    padding: 15px;
    background: #1c1c1c;
    border-radius: 12px;
    text-align: left;
    white-space: pre-wrap;
}
</style>
</head>

<body>

<h1>📡 micro:bit BLE 테스트</h1>

<button id="connect">
    Bluetooth 기기 검색
</button>

<div id="log">대기 중...</div>

<script>

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

const logElement =
    document.getElementById("log");

function log(text) {
    logElement.textContent +=
        "\n" + text;
}

document
.getElementById("connect")
.addEventListener("click", async () => {

    try {

        log("Bluetooth 검색 시작...");

        const device =
            await navigator.bluetooth.requestDevice({
                acceptAllDevices: true,
                optionalServices: [
                    SERVICE_UUID
                ]
            });

        log(
            "✅ 발견: " +
            (device.name || "이름 없음")
        );

        log(
            "ID: " +
            device.id
        );

        log("GATT 연결 중...");

        const server =
            await device.gatt.connect();

        log("✅ GATT 연결 성공");

        const service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        log("✅ UART Service 발견");

        const rx =
            await service.getCharacteristic(
                RX_UUID
            );

        log("✅ RX 발견");

        const tx =
            await service.getCharacteristic(
                TX_UUID
            );

        log("✅ TX 발견");

        await tx.startNotifications();

        tx.addEventListener(
            "characteristicvaluechanged",
            event => {

                const decoder =
                    new TextDecoder();

                const text =
                    decoder.decode(
                        event.target.value
                    );

                log(
                    "📥 " + text
                );
            }
        );

        log(
            "🎉 micro:bit UART 연결 완료!"
        );

    } catch (error) {

        log(
            "❌ " +
            error.name +
            ": " +
            error.message
        );

        console.error(error);

    }

});

</script>

</body>
</html>
