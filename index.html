<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0b0f">

<title>micro:bit AI</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #0b0b0f;
    color: #ececf1;
    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

body {
    overflow: hidden;
}

.app {
    display: flex;
    width: 100%;
    height: 100%;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    background: #171717;
    border-right: 1px solid #2b2b2b;
    display: flex;
    flex-direction: column;
    padding: 12px;
}

.logo {
    font-size: 18px;
    font-weight: 700;
    padding: 12px;
    margin-bottom: 8px;
}

.new-chat {
    width: 100%;
    background: transparent;
    border: 1px solid #3a3a3a;
    color: #fff;
    padding: 12px;
    border-radius: 8px;
    text-align: left;
    cursor: pointer;
    margin-bottom: 12px;
}

.new-chat:hover {
    background: #242424;
}

.sidebar-section {
    color: #888;
    font-size: 12px;
    padding: 8px 10px;
}

.command-list {
    overflow-y: auto;
    flex: 1;
}

.command-item {
    padding: 10px;
    border-radius: 7px;
    cursor: pointer;
    color: #ccc;
    font-size: 14px;
}

.command-item:hover {
    background: #252525;
}

.sidebar-bottom {
    border-top: 1px solid #2b2b2b;
    padding-top: 10px;
}

.sidebar-button {
    width: 100%;
    background: transparent;
    border: 0;
    color: #ccc;
    padding: 11px;
    text-align: left;
    border-radius: 7px;
    cursor: pointer;
}

.sidebar-button:hover {
    background: #252525;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
}

/* =========================
   TOP BAR
========================= */

.topbar {
    height: 58px;
    border-bottom: 1px solid #292929;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: #0b0b0f;
}

.title {
    font-size: 16px;
    font-weight: 600;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: #aaa;
}

.dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #777;
}

.dot.connected {
    background: #22c55e;
}

/* =========================
   CHAT
========================= */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px 15px 150px;
}

.message {
    width: 100%;
    max-width: 850px;
    margin: auto;
    display: flex;
    gap: 14px;
    padding: 20px 8px;
}

.avatar {
    width: 32px;
    height: 32px;
    min-width: 32px;
    border-radius: 7px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 17px;
}

.user-avatar {
    background: #3b82f6;
}

.bot-avatar {
    background: #10a37f;
}

.message-content {
    flex: 1;
    min-width: 0;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
}

.user-message {
    background: transparent;
}

.bot-message {
    background: #171717;
    border-radius: 8px;
}

/* =========================
   INPUT
========================= */

.input-area {
    position: fixed;
    bottom: 0;
    left: 270px;
    right: 0;
    padding: 14px 18px 20px;
    background:
        linear-gradient(
            transparent,
            #0b0b0f 25%
        );
}

.input-box {
    max-width: 850px;
    margin: auto;
    background: #1f1f1f;
    border: 1px solid #3a3a3a;
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 8px;
}

.input-box:focus-within {
    border-color: #555;
}

.input-box input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: 0;
    outline: 0;
    color: white;
    font-size: 15px;
    padding: 10px;
}

.send {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    border: 0;
    background: #10a37f;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.send:hover {
    background: #0d8f70;
}

/* =========================
   MODAL
========================= */

.modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 15px;
}

.modal.show {
    display: flex;
}

.modal-box {
    width: 100%;
    max-width: 520px;
    max-height: 90vh;
    overflow-y: auto;
    background: #181818;
    border: 1px solid #333;
    border-radius: 14px;
    padding: 20px;
}

.modal-title {
    font-size: 19px;
    font-weight: 700;
    margin-bottom: 18px;
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    color: #aaa;
    font-size: 13px;
    margin-bottom: 6px;
}

.field input,
.field textarea,
.field select {
    width: 100%;
    background: #101010;
    color: white;
    border: 1px solid #383838;
    border-radius: 8px;
    padding: 11px;
    outline: none;
}

.field textarea {
    min-height: 90px;
    resize: vertical;
}

.modal-buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 18px;
}

.btn {
    border: 0;
    border-radius: 8px;
    padding: 10px 15px;
    cursor: pointer;
    color: white;
}

.btn-green {
    background: #10a37f;
}

.btn-gray {
    background: #3a3a3a;
}

.btn-red {
    background: #dc2626;
}

/* =========================
   DEVICE PANEL
========================= */

.device-info {
    background: #101010;
    border: 1px solid #2f2f2f;
    border-radius: 9px;
    padding: 12px;
    margin-top: 10px;
}

.device-name {
    font-weight: 600;
}

.device-id {
    color: #777;
    font-size: 11px;
    margin-top: 4px;
    word-break: break-all;
}

.connect-button {
    width: 100%;
    margin-top: 10px;
    background: #2563eb;
    border: 0;
    color: white;
    padding: 11px;
    border-radius: 8px;
    cursor: pointer;
}

/* =========================
   SENSOR
========================= */

.sensor-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
}

.sensor-card {
    background: #101010;
    border: 1px solid #2c2c2c;
    border-radius: 8px;
    padding: 10px;
}

.sensor-label {
    color: #888;
    font-size: 11px;
}

.sensor-value {
    font-size: 18px;
    font-weight: 600;
    margin-top: 4px;
}

/* =========================
   LOG
========================= */

.log {
    background: #080808;
    border: 1px solid #292929;
    border-radius: 8px;
    padding: 9px;
    max-height: 170px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 10px;
    color: #aaa;
    white-space: pre-wrap;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        display: none;
    }

    .input-area {
        left: 0;
    }

    .topbar {
        padding: 0 12px;
    }

    .chat {
        padding-top: 10px;
    }

    .message {
        padding: 16px 5px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- =========================
         SIDEBAR
    ========================== -->

    <aside class="sidebar">

        <div class="logo">
            🤖 micro:bit AI
        </div>

        <button class="new-chat" onclick="newChat()">
            ＋ 새 채팅
        </button>

        <div class="sidebar-section">
            명령
        </div>

        <div
            class="command-list"
            id="commandList">
        </div>

        <div class="sidebar-bottom">

            <button
                class="sidebar-button"
                onclick="openDeviceModal()">
                📡 micro:bit 연결
            </button>

            <button
                class="sidebar-button"
                onclick="openCommandManager()">
                ⚙️ 명령 관리
            </button>

            <button
                class="sidebar-button"
                onclick="openSensorModal()">
                📊 센서
            </button>

        </div>

    </aside>


    <!-- =========================
         MAIN
    ========================== -->

    <main class="main">

        <div class="topbar">

            <div class="title">
                micro:bit AI
            </div>

            <div class="connection">

                <div
                    class="dot"
                    id="connectionDot">
                </div>

                <span id="connectionText">
                    연결 안 됨
                </span>

            </div>

        </div>


        <!-- CHAT -->

        <div
            class="chat"
            id="chat">

            <div class="message bot-message">

                <div class="avatar bot-avatar">
                    🤖
                </div>

                <div class="message-content">
                    안녕하세요! 👋

                    저는 micro:bit를 조종하는
                    작은 AI예요.

                    "하트 보여줘"
                    "불 켜줘"
                    "온도 알려줘"

                    처럼 자연스럽게 말해보세요!
                </div>

            </div>

        </div>


        <!-- INPUT -->

        <div class="input-area">

            <div class="input-box">

                <input
                    id="chatInput"
                    autocomplete="off"
                    placeholder="micro:bit에게 무엇을 시킬까요?"
                    onkeydown="handleEnter(event)"
                >

                <button
                    class="send"
                    onclick="sendChat()">
                    ↑
                </button>

            </div>

        </div>

    </main>

</div>


<!-- =========================
     DEVICE MODAL
========================= -->

<div
    class="modal"
    id="deviceModal">

    <div class="modal-box">

        <div class="modal-title">
            📡 micro:bit 연결
        </div>

        <div>
            Bluetooth 기기를 검색합니다.
        </div>

        <div class="device-info">

            <div
                class="device-name"
                id="deviceName">
                연결된 기기 없음
            </div>

            <div
                class="device-id"
                id="deviceId">
                -
            </div>

        </div>

        <button
            class="connect-button"
            onclick="connectBluetooth()">
            🔎 Bluetooth 기기 검색
        </button>

        <button
            class="connect-button"
            style="background:#444"
            onclick="disconnectBluetooth()">
            ❌ 연결 해제
        </button>

        <div
            class="log"
            id="bleLog"
            style="margin-top:12px;">
        </div>

        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeDeviceModal()">
                닫기
            </button>

        </div>

    </div>

</div>


<!-- =========================
     COMMAND MANAGER
========================= -->

<div
    class="modal"
    id="commandModal">

    <div class="modal-box">

        <div class="modal-title">
            ⚙️ 명령 관리
        </div>

        <button
            class="btn btn-green"
            onclick="openAddCommand()">
            ＋ 새 명령 추가
        </button>

        <div
            id="commandManagerList"
            style="margin-top:15px;">
        </div>

        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeCommandManager()">
                닫기
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ADD COMMAND
========================= -->

<div
    class="modal"
    id="addCommandModal">

    <div class="modal-box">

        <div class="modal-title">
            ＋ 명령 추가
        </div>

        <div class="field">

            <label>
                명령 이름
            </label>

            <input
                id="commandName"
                placeholder="예: 생일 축하">
        </div>

        <div class="field">

            <label>
                사용자가 말할 표현
            </label>

            <input
                id="commandTriggers"
                placeholder="생일 축하, 축하해, 생일">
        </div>

        <div class="field">

            <label>
                micro:bit 동작
            </label>

            <select id="commandAction">

                <option value="HELLO">
                    👋 HELLO
                </option>

                <option value="HEART">
                    ❤️ HEART
                </option>

                <option value="WHAT">
                    ❓ WHAT
                </option>

                <option value="DANCE">
                    💃 DANCE
                </option>

                <option value="BEEP">
                    🔊 BEEP
                </option>

                <option value="LED_ON">
                    💡 LED ON
                </option>

                <option value="LED_OFF">
                    🌑 LED OFF
                </option>

                <option value="TEMP">
                    🌡️ TEMP
                </option>

                <option value="LIGHT">
                    ☀️ LIGHT
                </option>

                <option value="SOUND">
                    🔊 SOUND
                </option>

                <option value="SENSOR">
                    📊 SENSOR
                </option>

                <option value="PING">
                    📡 PING
                </option>

            </select>

        </div>

        <div class="field">

            <label>
                AI 답변
            </label>

            <textarea
                id="commandResponse"
                placeholder="🎉 생일 축하해!">
            </textarea>

        </div>

        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeAddCommand()">
                취소
            </button>

            <button
                class="btn btn-green"
                onclick="saveCommand()">
                저장
            </button>

        </div>

    </div>

</div>


<!-- =========================
     SENSOR MODAL
========================= -->

<div
    class="modal"
    id="sensorModal">

    <div class="modal-box">

        <div class="modal-title">
            📊 micro:bit 센서
        </div>

        <div class="sensor-grid">

            <div class="sensor-card">
                <div class="sensor-label">
                    온도
                </div>
                <div
                    class="sensor-value"
                    id="temperature">
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-label">
                    빛
                </div>
                <div
                    class="sensor-value"
                    id="light">
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-label">
                    소리
                </div>
                <div
                    class="sensor-value"
                    id="sound">
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-label">
                    X
                </div>
                <div
                    class="sensor-value"
                    id="accelX">
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-label">
                    Y
                </div>
                <div
                    class="sensor-value"
                    id="accelY">
                    --
                </div>
            </div>

            <div class="sensor-card">
                <div class="sensor-label">
                    Z
                </div>
                <div
                    class="sensor-value"
                    id="accelZ">
                    --
                </div>
            </div>

        </div>

        <div class="modal-buttons">

            <button
                class="btn btn-gray"
                onclick="closeSensorModal()">
                닫기
            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   BLE UUID
===================================================== */

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


/* =====================================================
   BLE VARIABLES
===================================================== */

let bluetoothDevice = null;

let gattServer = null;

let rxCharacteristic = null;

let txCharacteristic = null;

let receivedBuffer = "";


/* =====================================================
   COMMANDS
===================================================== */

const defaultCommands = [

    {
        name: "인사",
        triggers: [
            "안녕",
            "hello",
            "hi"
        ],
        action: "HELLO",
        response: "안녕! 👋"
    },

    {
        name: "하트",
        triggers: [
            "하트",
            "사랑",
            "heart"
        ],
        action: "HEART",
        response: "❤️ 하트를 보여줄게!"
    },

    {
        name: "뭐하지",
        triggers: [
            "뭐하지",
            "뭐 해",
            "what"
        ],
        action: "WHAT",
        response: "🤔 재미있는 걸 해보자!"
    },

    {
        name: "춤",
        triggers: [
            "춤",
            "댄스",
            "dance"
        ],
        action: "DANCE",
        response: "💃 춤춰볼게!"
    },

    {
        name: "소리",
        triggers: [
            "소리",
            "삐",
            "beep"
        ],
        action: "BEEP",
        response: "🔊 삐!"
    },

    {
        name: "LED 켜기",
        triggers: [
            "불 켜",
            "led 켜",
            "led on"
        ],
        action: "LED_ON",
        response: "💡 LED를 켤게!"
    },

    {
        name: "LED 끄기",
        triggers: [
            "불 꺼",
            "led 꺼",
            "led off"
        ],
        action: "LED_OFF",
        response: "🌑 LED를 끌게!"
    },

    {
        name: "온도",
        triggers: [
            "온도",
            "temperature"
        ],
        action: "TEMP",
        response: "🌡️ 온도를 확인할게!"
    },

    {
        name: "빛",
        triggers: [
            "빛",
            "밝기",
            "light"
        ],
        action: "LIGHT",
        response: "☀️ 빛 센서를 확인할게!"
    },

    {
        name: "센서",
        triggers: [
            "센서",
            "sensor"
        ],
        action: "SENSOR",
        response: "📊 센서 데이터를 가져올게!"
    },

    {
        name: "PING",
        triggers: [
            "ping",
            "연결 확인"
        ],
        action: "PING",
        response: "📡 연결을 확인할게!"
    }

];


/* =====================================================
   LOCAL STORAGE
===================================================== */

function getCustomCommands() {

    try {

        return JSON.parse(
            localStorage.getItem(
                "microbit_commands"
            ) || "[]"
        );

    } catch {

        return [];
    }
}


function saveCustomCommands(commands) {

    localStorage.setItem(
        "microbit_commands",
        JSON.stringify(commands)
    );

}


/* =====================================================
   ALL COMMANDS
===================================================== */

function getAllCommands() {

    return [
        ...defaultCommands,
        ...getCustomCommands()
    ];

}


/* =====================================================
   COMMAND LIST
===================================================== */

function refreshCommandList() {

    const list =
        document.getElementById(
            "commandList"
        );

    list.innerHTML = "";

    getAllCommands().forEach(command => {

        const item =
            document.createElement("div");

        item.className =
            "command-item";

        item.textContent =
            "• " + command.name;

        item.onclick = () => {

            document.getElementById(
                "chatInput"
            ).value =
                command.triggers[0];

        };

        list.appendChild(item);

    });

}


/* =====================================================
   COMMAND MANAGER
===================================================== */

function openCommandManager() {

    renderCommandManager();

    document.getElementById(
        "commandModal"
    ).classList.add("show");

}


function closeCommandManager() {

    document.getElementById(
        "commandModal"
    ).classList.remove("show");

}


function renderCommandManager() {

    const box =
        document.getElementById(
            "commandManagerList"
        );

    box.innerHTML = "";

    const custom =
        getCustomCommands();

    if (custom.length === 0) {

        box.innerHTML =
            "<div style='color:#888;margin-top:15px'>사용자가 추가한 명령이 없습니다.</div>";

        return;
    }

    custom.forEach((command, index) => {

        const row =
            document.createElement("div");

        row.style.cssText =
            "background:#101010;border:1px solid #2c2c2c;border-radius:8px;padding:12px;margin-top:8px;";

        row.innerHTML = `
            <div style="font-weight:600">
                ${escapeHtml(command.name)}
            </div>

            <div style="font-size:12px;color:#888;margin-top:4px">
                ${escapeHtml(command.triggers.join(", "))}
            </div>

            <div style="font-size:12px;color:#10a37f;margin-top:5px">
                → ${escapeHtml(command.action)}
            </div>

            <button
                class="btn btn-red"
                style="margin-top:8px"
                onclick="deleteCommand(${index})">
                삭제
            </button>
        `;

        box.appendChild(row);

    });

}


function deleteCommand(index) {

    const commands =
        getCustomCommands();

    commands.splice(index, 1);

    saveCustomCommands(commands);

    renderCommandManager();

    refreshCommandList();

}


/* =====================================================
   ADD COMMAND
===================================================== */

function openAddCommand() {

    document.getElementById(
        "commandName"
    ).value = "";

    document.getElementById(
        "commandTriggers"
    ).value = "";

    document.getElementById(
        "commandResponse"
    ).value = "";

    document.getElementById(
        "commandAction"
    ).value = "HELLO";

    document.getElementById(
        "addCommandModal"
    ).classList.add("show");

}


function closeAddCommand() {

    document.getElementById(
        "addCommandModal"
    ).classList.remove("show");

}


function saveCommand() {

    const name =
        document.getElementById(
            "commandName"
        ).value.trim();

    const triggerText =
        document.getElementById(
            "commandTriggers"
        ).value.trim();

    const action =
        document.getElementById(
            "commandAction"
        ).value;

    const response =
        document.getElementById(
            "commandResponse"
        ).value.trim();


    if (!name) {

        alert("명령 이름을 입력하세요.");

        return;
    }


    if (!triggerText) {

        alert("사용자 표현을 입력하세요.");

        return;
    }


    const triggers =
        triggerText
            .split(",")
            .map(x => x.trim())
            .filter(Boolean);


    const commands =
        getCustomCommands();


    commands.push({

        name,
        triggers,
        action,
        response:
            response ||
            "명령을 실행했어요! 🤖"

    });


    saveCustomCommands(commands);

    closeAddCommand();

    refreshCommandList();

    renderCommandManager();


    addBotMessage(
        `새 명령 "${name}"을 추가했어요! ⚙️`
    );

}


/* =====================================================
   CHAT
===================================================== */

function handleEnter(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendChat();

    }

}


async function sendChat() {

    const input =
        document.getElementById(
            "chatInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }


    addUserMessage(text);

    input.value = "";


    await processChat(text);

}


/* =====================================================
   PROCESS CHAT
===================================================== */

async function processChat(text) {

    const normalized =
        text.toLowerCase().trim();

    const commands =
        getAllCommands();


    for (const command of commands) {

        for (const trigger of command.triggers) {

            if (
                normalized.includes(
                    trigger.toLowerCase()
                )
            ) {

                addBotMessage(
                    command.response
                );

                await sendCommand(
                    command.action
                );

                return;
            }

        }

    }


    addBotMessage(
        "🤔 아직 그 명령은 모르겠어요.\n\n" +
        "명령 관리에서 새로운 명령을 추가할 수 있어요!"
    );

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(text) {

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

/* =====================================================
   BLUETOOTH CONNECT
===================================================== */

async function connectBluetooth() {

    try {

        if (!navigator.bluetooth) {

            bleLog(
                "❌ Web Bluetooth를 지원하지 않습니다."
            );

            return;
        }


        bleLog(
            "🔎 Bluetooth 기기 검색..."
        );


        /*
         * 핵심 변경 부분
         *
         * 기존:
         * filters: [
         *     { services: [SERVICE_UUID] }
         * ]
         *
         * 현재:
         * acceptAllDevices: true
         *
         * 따라서 서비스 광고 필터 때문에
         * micro:bit가 목록에서 빠지는 것을 방지.
         */

        bluetoothDevice =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    SERVICE_UUID
                ]

            });


        bleLog(
            "✅ 선택: " +
            (
                bluetoothDevice.name ||
                "이름 없음"
            )
        );


        document.getElementById(
            "deviceName"
        ).textContent =
            bluetoothDevice.name ||
            "이름 없음";


        document.getElementById(
            "deviceId"
        ).textContent =
            bluetoothDevice.id ||
            "-";


        bluetoothDevice.addEventListener(
            "gattserverdisconnected",
            handleDisconnected
        );


        bleLog(
            "🔗 GATT 연결..."
        );


        gattServer =
            await bluetoothDevice.gatt.connect();


        bleLog(
            "✅ GATT 연결 성공"
        );


        const service =
            await gattServer.getPrimaryService(
                SERVICE_UUID
            );


        bleLog(
            "✅ UART 서비스 발견"
        );


        /*
         * 002
         * micro:bit → S25
         * INDICATE
         */

        rxCharacteristic =
            await service.getCharacteristic(
                RX_UUID
            );


        /*
         * 003
         * S25 → micro:bit
         * WRITE
         */

        txCharacteristic =
            await service.getCharacteristic(
                TX_UUID
            );


        bleLog(
            "✅ RX/TX characteristic 발견"
        );


        await rxCharacteristic.startNotifications();


        rxCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleBluetoothData
        );


        bleLog(
            "📡 수신 활성화"
        );


        document.getElementById(
            "connectionDot"
        ).classList.add("connected");


        document.getElementById(
            "connectionText"
        ).textContent =
            bluetoothDevice.name ||
            "micro:bit";


        addBotMessage(
            "🟢 micro:bit 연결 완료!"
        );


        await sendCommand("PING");


    } catch(error) {

        console.error(error);

        bleLog(
            "❌ " +
            error.name +
            ": " +
            error.message
        );

        addBotMessage(
            "❌ 연결 실패: " +
            error.message
        );

    }

}


/* =====================================================
   DISCONNECT
===================================================== */

function disconnectBluetooth() {

    try {

        if (
            bluetoothDevice &&
            bluetoothDevice.gatt &&
            bluetoothDevice.gatt.connected
        ) {

            bluetoothDevice.gatt.disconnect();

        }

    } catch(error) {

        bleLog(
            "❌ 해제 오류: " +
            error.message
        );

    }


    bluetoothDevice = null;

    gattServer = null;

    rxCharacteristic = null;

    txCharacteristic = null;


    document.getElementById(
        "connectionDot"
    ).classList.remove("connected");


    document.getElementById(
        "connectionText"
    ).textContent =
        "연결 안 됨";


    document.getElementById(
        "deviceName"
    ).textContent =
        "연결된 기기 없음";


    document.getElementById(
        "deviceId"
    ).textContent =
        "-";


    addBotMessage(
        "🔴 micro:bit 연결이 해제됐어요."
    );

}


/* =====================================================
   DISCONNECTED
===================================================== */

function handleDisconnected() {

    document.getElementById(
        "connectionDot"
    ).classList.remove("connected");

    document.getElementById(
        "connectionText"
    ).textContent =
        "연결 끊김";


    bleLog(
        "❌ micro:bit 연결 끊김"
    );

}


/* =====================================================
   RECEIVE
===================================================== */

function handleBluetoothData(event) {

    const data =
        new TextDecoder(
            "utf-8"
        ).decode(
            event.target.value
        );


    bleLog(
        "⬅️ " + data.trim()
    );


    receivedBuffer += data;


    const lines =
        receivedBuffer.split("\n");


    receivedBuffer =
        lines.pop() || "";


    for (const line of lines) {

        processReceivedData(
            line.trim()
        );

    }

}


/* =====================================================
   PROCESS RECEIVED
===================================================== */

function processReceivedData(data) {

    if (!data) {
        return;
    }


    /*
     * DATA,temp,light,sound,x,y,z,a,b
     */

    if (
        data.startsWith("DATA,")
    ) {

        const parts =
            data.split(",");


        if (parts.length >= 8) {

            document.getElementById(
                "temperature"
            ).textContent =
                parts[1];


            document.getElementById(
                "light"
            ).textContent =
                parts[2];


            document.getElementById(
                "sound"
            ).textContent =
                parts[3];


            document.getElementById(
                "accelX"
            ).textContent =
                parts[4];


            document.getElementById(
                "accelY"
            ).textContent =
                parts[5];


            document.getElementById(
                "accelZ"
            ).textContent =
                parts[6];

        }

        return;
    }


    if (
        data.startsWith("RECEIVED,")
    ) {

        addBotMessage(
            "micro:bit: " +
            data.substring(9)
        );

        return;
    }


    if (
        data.startsWith("RESULT,")
    ) {

        addBotMessage(
            "결과: " +
            data.substring(7)
        );

        return;
    }


    if (
        data === "PONG"
    ) {

        addBotMessage(
            "📡 micro:bit 응답: PONG"
        );

        return;
    }


    addBotMessage(
        "micro:bit: " + data
    );

}


/* =====================================================
   SEND
===================================================== */

async function sendCommand(command) {

    if (!txCharacteristic) {

        addBotMessage(
            "🔵 먼저 micro:bit를 연결해주세요."
        );

        return false;
    }


    try {

        const data =
            new TextEncoder().encode(
                command + "\n"
            );


        if (
            txCharacteristic
                .writeValueWithoutResponse
        ) {

            await txCharacteristic
                .writeValueWithoutResponse(
                    data
                );

        } else {

            await txCharacteristic
                .writeValue(
                    data
                );

        }


        bleLog(
            "➡️ " + command
        );


        return true;


    } catch(error) {

        bleLog(
            "❌ 전송 실패: " +
            error.message
        );

        return false;
    }

}
