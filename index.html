<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>micro:bit BLE Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101114;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

header {
    padding: 18px;
    background: #181a20;
    border-bottom: 1px solid #30333b;
}

header h1 {
    margin: 0 0 6px;
    font-size: 24px;
}

#status {
    font-size: 14px;
    color: #ffcc66;
}

.container {
    padding: 14px;
    max-width: 1000px;
    margin: auto;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 12px 16px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    color: white;
    background: #3b82f6;
}

button:active {
    transform: scale(0.97);
}

button.disconnect {
    background: #dc3545;
}

button.command {
    background: #7c3aed;
}

button.small {
    padding: 8px 12px;
    font-size: 13px;
}

.top-buttons {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 14px;
}

.grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.card {
    background: #181a20;
    border: 1px solid #2c2f38;
    border-radius: 14px;
    padding: 15px;
}

.card h2 {
    margin: 0 0 8px;
    font-size: 15px;
    color: #bfc4d0;
}

.value {
    font-size: 28px;
    font-weight: bold;
}

.unit {
    font-size: 14px;
    color: #888f9d;
}

.section {
    margin-top: 14px;
}

.section-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.sensor-ok {
    color: #55e68b;
}

.sensor-off {
    color: #ff7070;
}

.chat {
    height: 330px;
    overflow-y: auto;
    background: #0b0c0f;
    border: 1px solid #2c2f38;
    border-radius: 12px;
    padding: 10px;
}

.message {
    padding: 9px 11px;
    margin: 6px 0;
    border-radius: 10px;
    max-width: 90%;
    word-break: break-word;
}

.message.me {
    background: #17345f;
    margin-left: auto;
}

.message.micro {
    background: #22262f;
    margin-right: auto;
}

.message.system {
    background: #302a13;
    color: #ffd966;
    margin: auto;
    text-align: center;
    font-size: 13px;
}

.message small {
    display: block;
    margin-top: 4px;
    opacity: 0.55;
    font-size: 10px;
}

.input-row {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.input-row input {
    flex: 1;
    min-width: 0;
    background: #181a20;
    color: white;
    border: 1px solid #343842;
    border-radius: 10px;
    padding: 12px;
    font-size: 15px;
    outline: none;
}

.input-row input:focus {
    border-color: #3b82f6;
}

.commands {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
}

.command-input {
    display: flex;
    gap: 8px;
    margin-top: 8px;
}

.command-input input {
    flex: 1;
    min-width: 0;
    background: #181a20;
    color: white;
    border: 1px solid #343842;
    border-radius: 10px;
    padding: 12px;
    font-size: 14px;
}

.log {
    height: 190px;
    overflow-y: auto;
    background: #08090b;
    border: 1px solid #2c2f38;
    border-radius: 10px;
    padding: 10px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.axis {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
}

.axis-box {
    background: #101217;
    border-radius: 10px;
    padding: 12px;
    text-align: center;
}

.axis-box b {
    display: block;
    color: #8fa7ff;
    margin-bottom: 5px;
}

.button-state {
    display: flex;
    gap: 10px;
}

.ab {
    flex: 1;
    padding: 15px;
    border-radius: 12px;
    text-align: center;
    background: #101217;
}

.ab.active {
    background: #185c39;
    color: #7dffb0;
}

.progress {
    height: 8px;
    background: #292c34;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 8px;
}

.progress-bar {
    height: 100%;
    width: 0%;
    background: #3b82f6;
    transition: width 0.15s;
}

@media (max-width: 700px) {
    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .commands {
        grid-template-columns: repeat(2, 1fr);
    }

    .stat-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 420px) {
    .grid {
        grid-template-columns: 1fr 1fr;
    }

    .value {
        font-size: 23px;
    }

    button {
        padding: 10px 12px;
    }
}
</style>
</head>

<body>

<header>
    <h1>📡 micro:bit BLE Dashboard</h1>
    <div id="status">🔴 연결되지 않음</div>
</header>

<div class="container">

    <div class="top-buttons">
        <button id="connectBtn" onclick="connectBLE()">
            🔵 micro:bit 연결
        </button>

        <button
            id="disconnectBtn"
            class="disconnect"
            onclick="disconnectBLE()"
            disabled>
            🔌 연결 해제
        </button>
    </div>

    <!-- 센서 -->
    <div class="section">
        <div class="section-title">📊 센서</div>

        <div class="grid">

            <div class="card">
                <h2>🌡️ 온도</h2>
                <div class="value">
                    <span id="temperature">--</span>
                    <span class="unit">°C</span>
                </div>
            </div>

            <div class="card">
                <h2>💡 밝기</h2>
                <div class="value">
                    <span id="light">--</span>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="lightBar"></div>
                </div>
            </div>

            <div class="card">
                <h2>🔊 소리</h2>
                <div class="value">
                    <span id="sound">--</span>
                </div>
                <div class="progress">
                    <div class="progress-bar" id="soundBar"></div>
                </div>
            </div>

        </div>
    </div>

    <!-- 가속도 -->
    <div class="section">
        <div class="section-title">📐 가속도</div>

        <div class="axis">

            <div class="axis-box">
                <b>X</b>
                <span id="accX">--</span>
            </div>

            <div class="axis-box">
                <b>Y</b>
                <span id="accY">--</span>
            </div>

            <div class="axis-box">
                <b>Z</b>
                <span id="accZ">--</span>
            </div>

        </div>
    </div>

    <!-- 버튼 -->
    <div class="section">
        <div class="section-title">🎮 버튼</div>

        <div class="button-state">

            <div class="ab" id="buttonA">
                🔵 A<br>
                <b>OFF</b>
            </div>

            <div class="ab" id="buttonB">
                🟣 B<br>
                <b>OFF</b>
            </div>

        </div>
    </div>

    <!-- 통계 -->
    <div class="section">

        <div class="section-title">📦 통신 상태</div>

        <div class="stat-grid">

            <div class="card">
                <h2>패킷</h2>
                <div class="value" id="packetCount">0</div>
            </div>

            <div class="card">
                <h2>보낸 메시지</h2>
                <div class="value" id="sentCount">0</div>
            </div>

            <div class="card">
                <h2>받은 메시지</h2>
                <div class="value" id="receivedCount">0</div>
            </div>

        </div>
    </div>

    <!-- 채팅 -->
    <div class="section">

        <div class="section-title">💬 micro:bit 채팅</div>

        <div id="chat" class="chat"></div>

        <div class="input-row">

            <input
                id="messageInput"
                type="text"
                placeholder="micro:bit로 보낼 글자..."
                onkeydown="handleMessageKey(event)">

            <button onclick="sendMessage()">
                전송
            </button>

        </div>

    </div>

    <!-- 명령어 -->
    <div class="section">

        <div class="section-title">⚡ 명령어</div>

        <div class="commands">

            <button class="command" onclick="sendCommand('LED_ON')">
                💡 LED ON
            </button>

            <button class="command" onclick="sendCommand('LED_OFF')">
                🌑 LED OFF
            </button>

            <button class="command" onclick="sendCommand('HELLO')">
                👋 HELLO
            </button>

            <button class="command" onclick="sendCommand('PING')">
                📡 PING
            </button>

            <button class="command" onclick="sendCommand('CLEAR')">
                🧹 CLEAR
            </button>

            <button class="command" onclick="sendCommand('STATUS')">
                📊 STATUS
            </button>

            <button class="command" onclick="sendCommand('BEEP')">
                🔔 BEEP
            </button>

            <button class="command" onclick="sendCommand('RESET')">
                🔄 RESET
            </button>

        </div>

        <div class="command-input">

            <input
                id="commandInput"
                type="text"
                placeholder="직접 명령어 입력..."
                onkeydown="handleCommandKey(event)">

            <button
                class="command"
                onclick="sendCustomCommand()">
                실행
            </button>

        </div>

    </div>

    <!-- 로그 -->
    <div class="section">

        <div class="section-title">📜 BLE 로그</div>

        <div id="log" class="log"></div>

        <br>

        <button
            class="small"
            onclick="clearLog()">
            로그 지우기
        </button>

    </div>

</div>

<script>

const SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

/*
    네 micro:bit에서 실제로 확인된 구조

    002 = INDICATE
    micro:bit → S25

    003 = WRITE
    S25 → micro:bit
*/

const MICROBIT_TO_PHONE_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const PHONE_TO_MICROBIT_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

let device = null;
let server = null;
let service = null;

let microbitToPhone = null;
let phoneToMicrobit = null;

let packetCount = 0;
let sentCount = 0;
let receivedCount = 0;

let receiveBuffer = "";


/* =========================
   로그
========================= */

function log(message) {

    const logBox = document.getElementById("log");

    const time =
        new Date().toLocaleTimeString();

    logBox.textContent +=
        "[" + time + "] " + message + "\n";

    logBox.scrollTop =
        logBox.scrollHeight;

    console.log(message);
}


function clearLog() {
    document.getElementById("log").textContent = "";
}


/* =========================
   상태
========================= */

function setStatus(text, color = "#ffcc66") {

    const status =
        document.getElementById("status");

    status.textContent = text;
    status.style.color = color;
}


/* =========================
   BLE 연결
========================= */

async function connectBLE() {

    try {

        if (!navigator.bluetooth) {

            alert(
                "이 브라우저는 Web Bluetooth를 지원하지 않습니다."
            );

            return;
        }

        setStatus(
            "🟡 micro:bit 검색 중...",
            "#ffcc66"
        );

        log("micro:bit 검색 시작");

        device =
            await navigator.bluetooth.requestDevice({

                acceptAllDevices: true,

                optionalServices: [
                    SERVICE_UUID
                ]

            });

        log(
            "기기 발견: " +
            (device.name || "이름 없음")
        );

        device.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );

        setStatus(
            "🟡 GATT 연결 중...",
            "#ffcc66"
        );

        server =
            await device.gatt.connect();

        log("GATT 연결 성공");

        service =
            await server.getPrimaryService(
                SERVICE_UUID
            );

        log("UART 서비스 발견");

        microbitToPhone =
            await service.getCharacteristic(
                MICROBIT_TO_PHONE_UUID
            );

        log(
            "002 characteristic 발견: INDICATE"
        );

        phoneToMicrobit =
            await service.getCharacteristic(
                PHONE_TO_MICROBIT_UUID
            );

        log(
            "003 characteristic 발견: WRITE"
        );

        /*
            002는 INDICATE이므로
            startNotifications()를 사용해
            indication subscription을 요청한다.
        */

        try {

            await microbitToPhone.startNotifications();

            microbitToPhone.addEventListener(
                "characteristicvaluechanged",
                handleIncomingData
            );

            log("INDICATE 활성화");

        } catch (error) {

            log(
                "❌ INDICATE 활성화 실패: " +
                error.message
            );

            /*
                연결 자체는 유지하고
                송신 기능은 사용할 수 있도록 한다.
            */
        }

        document.getElementById(
            "connectBtn"
        ).disabled = true;

        document.getElementById(
            "disconnectBtn"
        ).disabled = false;

        setStatus(
            "🟢 연결됨: " +
            (device.name || "micro:bit"),
            "#55e68b"
        );

        addSystemMessage(
            "micro:bit에 연결되었습니다."
        );

    } catch (error) {

        console.error(error);

        log(
            "❌ 연결 실패: " +
            error.name +
            " / " +
            error.message
        );

        setStatus(
            "🔴 연결 실패",
            "#ff7070"
        );
    }
}


/* =========================
   연결 해제
========================= */

function disconnectBLE() {

    if (
        device &&
        device.gatt &&
        device.gatt.connected
    ) {

        device.gatt.disconnect();

    } else {

        onDisconnected();
    }
}


function onDisconnected() {

    log("🔴 micro:bit 연결 해제");

    setStatus(
        "🔴 연결되지 않음",
        "#ff7070"
    );

    document.getElementById(
        "connectBtn"
    ).disabled = false;

    document.getElementById(
        "disconnectBtn"
    ).disabled = true;

    microbitToPhone = null;
    phoneToMicrobit = null;
}


/* =========================
   연결 확인
========================= */

function isConnected() {

    return (
        phoneToMicrobit &&
        device &&
        device.gatt &&
        device.gatt.connected
    );
}


/* =========================
   문자열 전송
========================= */

async function sendText(text) {

    if (!isConnected()) {

        addSystemMessage(
            "먼저 micro:bit를 연결하세요."
        );

        return false;
    }

    if (!text || text.length === 0) {
        return false;
    }

    try {

        const encoder =
            new TextEncoder();

        /*
            micro:bit UART에서
            한 줄 단위로 처리하기 위해
            반드시 \n을 붙인다.
        */

        const data =
            encoder.encode(text + "\n");

        /*
            003은 WRITE / WRITE_NO_RESPONSE
        */

        if (
            phoneToMicrobit.writeValueWithoutResponse
        ) {

            await phoneToMicrobit
                .writeValueWithoutResponse(data);

        } else {

            await phoneToMicrobit
                .writeValue(data);
        }

        sentCount++;

        document.getElementById(
            "sentCount"
        ).textContent = sentCount;

        log(
            "TX ← " + text
        );

        return true;

    } catch (error) {

        log(
            "❌ TX 실패: " +
            error.message
        );

        return false;
    }
}


/* =========================
   채팅 전송
========================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    const success =
        await sendText(text);

    if (success) {

        addMessage(
            "나",
            text,
            "me"
        );

        input.value = "";
        input.focus();
    }
}


function handleMessageKey(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendMessage();
    }
}


/* =========================
   명령어
========================= */

async function sendCommand(command) {

    const success =
        await sendText(command);

    if (success) {

        addMessage(
            "명령어",
            command,
            "me"
        );
    }
}


async function sendCustomCommand() {

    const input =
        document.getElementById(
            "commandInput"
        );

    const command =
        input.value.trim();

    if (!command) {
        return;
    }

    const success =
        await sendText(command);

    if (success) {

        addMessage(
            "명령어",
            command,
            "me"
        );

        input.value = "";
    }
}


function handleCommandKey(event) {

    if (event.key === "Enter") {

        event.preventDefault();

        sendCustomCommand();
    }
}


/* =========================
   수신 데이터
========================= */

function handleIncomingData(event) {

    const value =
        event.target.value;

    const decoder =
        new TextDecoder();

    const text =
        decoder.decode(value);

    log(
        "RX → " +
        text.replace(/\n/g, "\\n")
    );

    receiveBuffer += text;

    /*
        여러 줄이 한 번에 들어오는 경우 처리
    */

    const lines =
        receiveBuffer.split("\n");

    receiveBuffer =
        lines.pop();

    for (
        const line of lines
    ) {

        const clean =
            line.trim();

        if (!clean) {
            continue;
        }

        processIncomingLine(clean);
    }
}


/* =========================
   데이터 처리
========================= */

function processIncomingLine(line) {

    receivedCount++;

    document.getElementById(
        "receivedCount"
    ).textContent =
        receivedCount;


    /*
        센서 패킷

        DATA,
        temperature,
        light,
        sound,
        x,
        y,
        z,
        a,
        b
    */

    if (
        line.startsWith("DATA,")
    ) {

        parseSensorData(line);

        return;
    }


    /*
        일반 텍스트
    */

    addMessage(
        "micro:bit",
        line,
        "micro"
    );
}


/* =========================
   센서 데이터
========================= */

function parseSensorData(line) {

    const parts =
        line.split(",");

    if (parts.length < 9) {

        log(
            "⚠️ 잘못된 DATA 패킷: " +
            line
        );

        return;
    }

    const temperature =
        parts[1];

    const light =
        Number(parts[2]);

    const sound =
        Number(parts[3]);

    const x =
        parts[4];

    const y =
        parts[5];

    const z =
        parts[6];

    const a =
        parts[7];

    const b =
        parts[8];


    document.getElementById(
        "temperature"
    ).textContent =
        temperature;


    document.getElementById(
        "light"
    ).textContent =
        light;


    document.getElementById(
        "sound"
    ).textContent =
        sound;


    document.getElementById(
        "accX"
    ).textContent =
        x;


    document.getElementById(
        "accY"
    ).textContent =
        y;


    document.getElementById(
        "accZ"
    ).textContent =
        z;


    updateProgress(
        "lightBar",
        light
    );


    updateProgress(
        "soundBar",
        sound
    );


    updateButton(
        "buttonA",
        a
    );


    updateButton(
        "buttonB",
        b
    );


    packetCount++;

    document.getElementById(
        "packetCount"
    ).textContent =
        packetCount;
}


/* =========================
   게이지
========================= */

function updateProgress(
    id,
    value
) {

    let percent =
        Number(value);

    if (isNaN(percent)) {
        percent = 0;
    }

    percent =
        Math.max(
            0,
            Math.min(
                100,
                percent
            )
        );

    document.getElementById(
        id
    ).style.width =
        percent + "%";
}


/* =========================
   버튼 표시
========================= */

function updateButton(
    id,
    value
) {

    const box =
        document.getElementById(id);

    const numeric =
        Number(value);

    if (
        value === "1" ||
        value === "true" ||
        numeric === 1
    ) {

        box.classList.add("active");

        box.innerHTML =
            box.id === "buttonA"
                ? "🔵 A<br><b>ON</b>"
                : "🟣 B<br><b>ON</b>";

    } else {

        box.classList.remove("active");

        box.innerHTML =
            box.id === "buttonA"
                ? "🔵 A<br><b>OFF</b>"
                : "🟣 B<br><b>OFF</b>";
    }
}


/* =========================
   채팅 UI
========================= */

function addMessage(
    sender,
    text,
    type
) {

    const chat =
        document.getElementById(
            "chat"
        );

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message " + type;

    const content =
        document.createElement(
            "div"
        );

    content.textContent =
        text;

    const time =
        document.createElement(
            "small"
        );

    time.textContent =
        new Date().toLocaleTimeString();

    message.appendChild(content);
    message.appendChild(time);

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


function addSystemMessage(
    text
) {

    const chat =
        document.getElementById(
            "chat"
        );

    const message =
        document.createElement(
            "div"
        );

    message.className =
        "message system";

    message.textContent =
        text;

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}
