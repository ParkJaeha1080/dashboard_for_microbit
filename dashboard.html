<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<title>micro:bit Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at top, #20283a 0%, #0b0e14 45%, #07090d 100%);
    color: #f5f7fb;
    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

.app {
    width: min(1100px, 100%);
    margin: auto;
    padding: 18px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    margin-bottom: 18px;
}

.title {
    display: flex;
    align-items: center;
    gap: 12px;
}

.logo {
    width: 48px;
    height: 48px;
    border-radius: 14px;
    display: grid;
    place-items: center;
    background: #242b3b;
    font-size: 27px;
}

h1 {
    margin: 0;
    font-size: 25px;
}

.subtitle {
    color: #8f99aa;
    font-size: 13px;
    margin-top: 3px;
}

.status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    border-radius: 999px;
    background: #181d27;
    color: #aab3c2;
    font-size: 13px;
}

.status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #e04b4b;
}

.status.connected .status-dot {
    background: #35d07f;
}

.card {
    background: rgba(20, 25, 34, 0.88);
    border: 1px solid #293140;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 12px 35px rgba(0,0,0,.2);
}

.controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 18px;
}

button {
    border: 0;
    border-radius: 13px;
    padding: 13px 18px;
    background: #293244;
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

button:active {
    transform: scale(.97);
}

button.primary {
    background: #3d7cff;
}

button.danger {
    background: #b83e4b;
}

button:disabled {
    opacity: .45;
    cursor: not-allowed;
}

.grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 13px;
}

.sensor {
    min-height: 135px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

.sensor-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.sensor-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #252d3b;
    display: grid;
    place-items: center;
    font-size: 20px;
}

.sensor-name {
    color: #8f99aa;
    font-size: 13px;
}

.sensor-value {
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1px;
}

.sensor-unit {
    color: #8f99aa;
    font-size: 13px;
}

.full {
    grid-column: span 2;
}

.chart-card {
    margin-top: 13px;
}

.chart-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
}

.chart-title strong {
    font-size: 17px;
}

.chart-title span {
    color: #7e899b;
    font-size: 12px;
}

canvas {
    width: 100%;
    height: 220px;
    display: block;
    background: #0d1118;
    border-radius: 14px;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 13px;
    margin-top: 13px;
}

.button-state {
    padding: 22px;
    text-align: center;
    border-radius: 16px;
    background: #121720;
    border: 1px solid #252d3a;
}

.button-state.active {
    background: #263f31;
    border-color: #3cc77b;
}

.button-letter {
    font-size: 32px;
    font-weight: 900;
}

.button-label {
    margin-top: 5px;
    color: #8f99aa;
    font-size: 13px;
}

.command-card {
    margin-top: 13px;
}

.command-row {
    display: flex;
    gap: 8px;
}

.command-row input {
    flex: 1;
    min-width: 0;
    border: 1px solid #30394a;
    outline: none;
    border-radius: 12px;
    background: #0d1118;
    color: white;
    padding: 14px;
    font-size: 15px;
}

.command-row input:focus {
    border-color: #3d7cff;
}

.log-card {
    margin-top: 13px;
}

.log {
    height: 170px;
    overflow-y: auto;
    background: #0a0d12;
    border-radius: 13px;
    padding: 12px;
    font-family: monospace;
    font-size: 12px;
    color: #8994a5;
}

.log-line {
    margin-bottom: 5px;
}

.log-line.good {
    color: #5fd896;
}

.log-line.error {
    color: #ed6d79;
}

footer {
    text-align: center;
    padding: 20px;
    color: #596477;
    font-size: 12px;
}

@media (max-width: 750px) {

    .grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .full {
        grid-column: span 2;
    }

    header {
        align-items: flex-start;
    }

    .status {
        font-size: 11px;
        padding: 8px 10px;
    }

    h1 {
        font-size: 21px;
    }
}

@media (max-width: 430px) {

    .app {
        padding: 12px;
    }

    .grid {
        gap: 9px;
    }

    .card {
        border-radius: 16px;
        padding: 13px;
    }

    .sensor {
        min-height: 120px;
    }

    .sensor-value {
        font-size: 25px;
    }

    button {
        flex: 1;
    }
}
</style>
</head>

<body>

<div class="app">

<header>

    <div class="title">

        <div class="logo">
            🤖
        </div>

        <div>
            <h1>micro:bit Dashboard</h1>
            <div class="subtitle">
                BLE Sensor Monitor
            </div>
        </div>

    </div>

    <div id="status" class="status">

        <span class="status-dot"></span>

        <span id="statusText">
            연결 안 됨
        </span>

    </div>

</header>


<div class="controls">

    <button
        id="connectButton"
        class="primary">

        🔵 micro:bit 연결

    </button>

    <button
        id="disconnectButton"
        class="danger"
        disabled>

        🔴 연결 해제

    </button>

</div>


<div class="grid">

    <div class="card sensor">

        <div class="sensor-top">

            <div class="sensor-icon">
                🌡️
            </div>

            <div class="sensor-name">
                TEMPERATURE
            </div>

        </div>

        <div>
            <span
                id="temperature"
                class="sensor-value">
                --
            </span>

            <span class="sensor-unit">
                °C
            </span>
        </div>

    </div>


    <div class="card sensor">

        <div class="sensor-top">

            <div class="sensor-icon">
                💡
            </div>

            <div class="sensor-name">
                LIGHT
            </div>

        </div>

        <div>
            <span
                id="light"
                class="sensor-value">
                --
            </span>

            <span class="sensor-unit">
                /255
            </span>
        </div>

    </div>


    <div class="card sensor">

        <div class="sensor-top">

            <div class="sensor-icon">
                🎤
            </div>

            <div class="sensor-name">
                SOUND
            </div>

        </div>

        <div>
            <span
                id="sound"
                class="sensor-value">
                --
            </span>

            <span class="sensor-unit">
                /255
            </span>
        </div>

    </div>


    <div class="card sensor">

        <div class="sensor-top">

            <div class="sensor-icon">
                📡
            </div>

            <div class="sensor-name">
                PACKETS
            </div>

        </div>

        <div>
            <span
                id="packets"
                class="sensor-value">
                0
            </span>

            <span class="sensor-unit">
                received
            </span>
        </div>

    </div>


    <div class="card sensor full">

        <div class="sensor-top">

            <div class="sensor-icon">
                📐
            </div>

            <div class="sensor-name">
                ACCELERATION X
            </div>

        </div>

        <div>
            <span
                id="accelX"
                class="sensor-value">
                --
            </span>

            <span class="sensor-unit">
                mg
            </span>
        </div>

    </div>


    <div class="card sensor full">

        <div class="sensor-top">

            <div class="sensor-icon">
                📐
            </div>

            <div class="sensor-name">
                ACCELERATION Y
            </div>

        </div>

        <div>
            <span
                id="accelY"
                class="sensor-value">
                --
            </span>

            <span class="sensor-unit">
                mg
            </span>
        </div>

    </div>


    <div class="card sensor full">

        <div class="sensor-top">

            <div class="sensor-icon">
                📐
            </div>

            <div class="sensor-name">
                ACCELERATION Z
            </div>

        </div>

        <div>
            <span
                id="accelZ"
                class="sensor-value">
                --
            </span>

            <span class="sensor-unit">
                mg
            </span>
        </div>

    </div>

</div>


<div class="card chart-card">

    <div class="chart-title">

        <strong>
            📈 센서 그래프
        </strong>

        <span>
            최근 데이터
        </span>

    </div>

    <canvas id="chart"></canvas>

</div>


<div class="buttons">

    <div
        id="buttonA"
        class="button-state">

        <div class="button-letter">
            A
        </div>

        <div class="button-label">
            RELEASED
        </div>

    </div>


    <div
        id="buttonB"
        class="button-state">

        <div class="button-letter">
            B
        </div>

        <div class="button-label">
            RELEASED
        </div>

    </div>

</div>


<div class="card command-card">

    <div class="chart-title">

        <strong>
            🎮 micro:bit 명령
        </strong>

        <span>
            UART
        </span>

    </div>

    <div class="command-row">

        <input
            id="commandInput"
            type="text"
            placeholder="예: LED_ON">

        <button
            id="sendButton"
            class="primary">

            전송

        </button>

    </div>

</div>


<div class="card log-card">

    <div class="chart-title">

        <strong>
            📋 이벤트 로그
        </strong>

        <button id="clearLog">
            지우기
        </button>

    </div>

    <div id="log" class="log"></div>

</div>


<footer>
    micro:bit V2 · Web Bluetooth Dashboard
</footer>

</div>


<script>

const UART_SERVICE_UUID =
    "6e400001-b5a3-f393-e0a9-e50e24dcca9e";

const UART_RX_UUID =
    "6e400002-b5a3-f393-e0a9-e50e24dcca9e";

const UART_TX_UUID =
    "6e400003-b5a3-f393-e0a9-e50e24dcca9e";


let device = null;
let server = null;

let rxCharacteristic = null;
let txCharacteristic = null;

let packetCount = 0;

const graphData = [];

const MAX_GRAPH_POINTS = 80;


const $ = id =>
    document.getElementById(id);


function log(message, type = "") {

    const line =
        document.createElement("div");

    line.className =
        "log-line " + type;

    const time =
        new Date().toLocaleTimeString();

    line.textContent =
        `[${time}] ${message}`;

    $("log").appendChild(line);

    $("log").scrollTop =
        $("log").scrollHeight;
}


function setStatus(text, connected = false) {

    $("statusText").textContent =
        text;

    $("status").classList.toggle(
        "connected",
        connected
    );

}


function updateValue(id, value) {

    $(id).textContent =
        value;

}


function parsePacket(text) {

    text =
        text.trim();

    if (!text) {
        return;
    }

    /*
        micro:bit에서 다음 형식으로 보낸다.

        DATA,temperature,light,sound,x,y,z,A,B

        예:

        DATA,24,137,58,100,-20,1010,0,1
    */

    const parts =
        text.split(",");

    if (parts[0] !== "DATA") {

        log(
            "micro:bit: " + text
        );

        return;
    }

    if (parts.length < 9) {

        log(
            "잘못된 데이터: " + text,
            "error"
        );

        return;
    }

    const temperature =
        Number(parts[1]);

    const light =
        Number(parts[2]);

    const sound =
        Number(parts[3]);

    const x =
        Number(parts[4]);

    const y =
        Number(parts[5]);

    const z =
        Number(parts[6]);

    const buttonA =
        Number(parts[7]);

    const buttonB =
        Number(parts[8]);


    updateValue(
        "temperature",
        temperature
    );

    updateValue(
        "light",
        light
    );

    updateValue(
        "sound",
        sound
    );

    updateValue(
        "accelX",
        x
    );

    updateValue(
        "accelY",
        y
    );

    updateValue(
        "accelZ",
        z
    );


    packetCount++;

    updateValue(
        "packets",
        packetCount
    );


    updateButton(
        "buttonA",
        buttonA
    );

    updateButton(
        "buttonB",
        buttonB
    );


    graphData.push({
        sound: sound,
        light: light,
        temperature: temperature
    });

    if (
        graphData.length >
        MAX_GRAPH_POINTS
    ) {
        graphData.shift();
    }

    drawChart();
}


function updateButton(id, state) {

    const element =
        $(id);

    const label =
        element.querySelector(
            ".button-label"
        );

    if (state) {

        element.classList.add("active");

        label.textContent =
            "PRESSED";

    } else {

        element.classList.remove("active");

        label.textContent =
            "RELEASED";
    }
}


let receiveBuffer = "";


async function handleNotification(event) {

    const value =
        event.target.value;

    const decoder =
        new TextDecoder();

    const text =
        decoder.decode(value);

    receiveBuffer += text;

    const lines =
        receiveBuffer.split("\n");

    receiveBuffer =
        lines.pop();

    for (const line of lines) {

        parsePacket(line);
    }
}


async function connectMicrobit() {

    if (!navigator.bluetooth) {

        alert(
            "이 브라우저는 Web Bluetooth를 지원하지 않습니다."
        );

        return;
    }


    try {

        log(
            "micro:bit 검색 중..."
        );

        setStatus(
            "검색 중..."
        );


        device =
            await navigator.bluetooth.requestDevice({

                filters: [
                    {
                        services: [
                            UART_SERVICE_UUID
                        ]
                    }
                ],

                optionalServices: [
                    UART_SERVICE_UUID
                ]

            });


        log(
            "발견: " +
            (device.name || "micro:bit"),
            "good"
        );


        device.addEventListener(
            "gattserverdisconnected",
            onDisconnected
        );


        server =
            await device.gatt.connect();


        log(
            "GATT 연결 완료",
            "good"
        );


        const service =
            await server.getPrimaryService(
                UART_SERVICE_UUID
            );


        rxCharacteristic =
            await service.getCharacteristic(
                UART_RX_UUID
            );


        txCharacteristic =
            await service.getCharacteristic(
                UART_TX_UUID
            );


        await txCharacteristic.startNotifications();


        txCharacteristic.addEventListener(
            "characteristicvaluechanged",
            handleNotification
        );


        setStatus(
            "연결됨",
            true
        );


        $("connectButton").disabled =
            true;

        $("disconnectButton").disabled =
            false;


        log(
            "UART 준비 완료!",
            "good"
        );


        await sendCommand(
            "HELLO"
        );

    }
    catch (error) {

        console.error(error);

        log(
            "연결 실패: " +
            error.message,
            "error"
        );

        setStatus(
            "연결 실패"
        );

    }

}


function onDisconnected() {

    log(
        "micro:bit 연결 끊김",
        "error"
    );

    setStatus(
        "연결 안 됨"
    );

    $("connectButton").disabled =
        false;

    $("disconnectButton").disabled =
        true;

    rxCharacteristic =
        null;

    txCharacteristic =
        null;

}


function disconnectMicrobit() {

    if (
        device &&
        device.gatt &&
        device.gatt.connected
    ) {

        device.gatt.disconnect();

    }

    onDisconnected();

}


async function sendCommand(command) {

    if (!rxCharacteristic) {

        log(
            "micro:bit가 연결되지 않았습니다.",
            "error"
        );

        return;
    }


    try {

        const encoder =
            new TextEncoder();

        const data =
            encoder.encode(
                command + "\n"
            );


        /*
            BLE characteristic은 한 번에
            너무 큰 데이터를 보내면 안 되므로
            작은 조각으로 나눠서 보낸다.
        */

        const CHUNK_SIZE = 20;


        for (
            let i = 0;
            i < data.length;
            i += CHUNK_SIZE
        ) {

            const chunk =
                data.slice(
                    i,
                    i + CHUNK_SIZE
                );


            if (
                rxCharacteristic.writeValueWithoutResponse
            ) {

                await rxCharacteristic
                    .writeValueWithoutResponse(
                        chunk
                    );

            } else {

                await rxCharacteristic
                    .writeValue(chunk);

            }


            await sleep(35);
        }


        log(
            "전송: " + command,
            "good"
        );

    }
    catch (error) {

        console.error(error);

        log(
            "전송 실패: " +
            error.message,
            "error"
        );

    }

}


function sleep(ms) {

    return new Promise(
        resolve =>
            setTimeout(
                resolve,
                ms
            )
    );

}


function drawChart() {

    const canvas =
        $("chart");

    const rect =
        canvas.getBoundingClientRect();


    const dpr =
        window.devicePixelRatio || 1;


    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;


    const ctx =
        canvas.getContext("2d");


    ctx.scale(dpr, dpr);


    const width =
        rect.width;

    const height =
        rect.height;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /*
        Grid
    */

    ctx.strokeStyle =
        "#202733";

    ctx.lineWidth =
        1;


    for (
        let i = 1;
        i < 5;
        i++
    ) {

        const y =
            height *
            i / 5;

        ctx.beginPath();

        ctx.moveTo(
            0,
            y
        );

        ctx.lineTo(
            width,
            y
        );

        ctx.stroke();
    }


    if (graphData.length < 2) {
        return;
    }


    drawLine(
        ctx,
        graphData.map(
            item => item.sound
        ),
        255,
        width,
        height
    );


    drawLine(
        ctx,
        graphData.map(
            item => item.light
        ),
        255,
        width,
        height
    );

}


function drawLine(
    ctx,
    values,
    maxValue,
    width,
    height
) {

    if (values.length < 2) {
        return;
    }


    ctx.beginPath();


    values.forEach(
        (value, index) => {

            const x =
                index /
                (MAX_GRAPH_POINTS - 1) *
                width;


            const normalized =
                Math.max(
                    0,
                    Math.min(
                        1,
                        value / maxValue
                    )
                );


            const y =
                height -
                normalized *
                height;


            if (index === 0) {

                ctx.moveTo(
                    x,
                    y
                );

            } else {

                ctx.lineTo(
                    x,
                    y
                );

            }

        }
    );


    ctx.strokeStyle =
        "#4d8dff";

    ctx.lineWidth =
        2;

    ctx.stroke();

}


$("connectButton").addEventListener(
    "click",
    connectMicrobit
);


$("disconnectButton").addEventListener(
    "click",
    disconnectMicrobit
);


$("sendButton").addEventListener(
    "click",
    async () => {

        const input =
            $("commandInput");

        const command =
            input.value.trim();


        if (!command) {
            return;
        }


        await sendCommand(
            command
        );


        input.value =
            "";

    }
);


$("commandInput").addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            $("sendButton").click();

        }

    }
);


$("clearLog").addEventListener(
    "click",
    () => {

        $("log").innerHTML =
            "";

    }
);


window.addEventListener(
    "resize",
    drawChart
);


log(
    "Dashboard 준비 완료",
    "good"
);


if (!navigator.bluetooth) {

    log(
        "Web Bluetooth를 사용할 수 없습니다.",
        "error"
    );

}

</script>

</body>
</html>
